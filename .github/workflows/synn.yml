name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GH_PUSH_TOKEN }}

      - name: Configure git
        run: |
          set -euo pipefail
          git config --local user.email "github-actions@users.noreply.github.com"
          git config --local user.name  "github-actions"

      - name: Sync with upstream
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/termux/termux-packages.git 2>/dev/null || \
            git remote set-url upstream https://github.com/termux/termux-packages.git

          git fetch upstream master
          git checkout master

          # ------------------------------------------------------------------
          # 1. Snapshot the paths we want to keep OUR version of, no matter
          #    what upstream does. Right now that's just the workflow files.
          #    Add more paths here if you have other files you edit locally
          #    and never want overwritten.
          # ------------------------------------------------------------------
          KEEP_PATHS=(".github/workflows")
          mkdir -p /tmp/keep
          for p in "${KEEP_PATHS[@]}"; do
            dest="/tmp/keep/${p//\//__}"
            rm -rf "$dest"
            if [ -e "$p" ]; then
              cp -r "$p" "$dest"
            fi
          done

          # ------------------------------------------------------------------
          # 2. Reset every tracked file to upstream's version.
          #    - Files shared with upstream  → upstream wins (this is the fix)
          #    - Files only in our repo       → untouched (kept as-is)
          #    - Files we deleted but up      → recreated from upstream
          #      stream still has
          # ------------------------------------------------------------------
          git checkout upstream/master -- .

          # ------------------------------------------------------------------
          # 3. Restore the paths we explicitly protected.
          # ------------------------------------------------------------------
          for p in "${KEEP_PATHS[@]}"; do
            src="/tmp/keep/${p//\//__}"
            if [ -e "$src" ]; then
              rm -rf "$p"
              mkdir -p "$(dirname "$p")"
              cp -r "$src" "$p"
            fi
          done

          # ------------------------------------------------------------------
          # 4. Show what actually changed (nice for the run log).
          # ------------------------------------------------------------------
          echo ">>> changes staged for this sync:"
          git add -A
          git diff --cached --stat | tail -30 || true

          if git diff --cached --quiet; then
            echo ">>> No changes — already up to date with upstream."
          else
            git commit -m "chore: sync with upstream $(date -u +%Y%m%d-%H%M%S)"
            echo ">>> committed sync"
          fi

      - name: Push
        run: |
          set -euo pipefail

          git remote set-url origin \
            "https://x-access-token:${{ secrets.GH_PUSH_TOKEN }}@github.com/${{ github.repository }}"

          pushed=0
          for i in 1 2 3; do
            if git push --force origin "HEAD:refs/heads/master"; then
              echo "✔ pushed on attempt $i"
              pushed=1
              break
            fi
            echo "push attempt $i failed; retrying in 5s"
            sleep 5
          done

          if [ "${pushed}" -ne 1 ]; then
            echo "::error::push failed after 3 attempts"
            exit 1
          fi
          echo ">>> push succeeded"
