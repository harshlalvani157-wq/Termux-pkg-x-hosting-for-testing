name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------------------
      # 1. Checkout with PAT (falls back to built-in token)
      # -------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GH_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------------
      # 2. Set git identity + configure remote with token inline
      # -------------------------------------------------------------------
      - name: Configure git for pushing
        run: |
          set -euo pipefail
          git config --local user.email "github-actions@users.noreply.github.com"
          git config --local user.name  "github-actions"
          git remote set-url origin \
            "https://x-access-token:${{ secrets.GH_PUSH_TOKEN || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git remote -v
          git --no-pager log -1 --oneline

      # -------------------------------------------------------------------
      # 3. Fetch + merge upstream, resolving conflicts in favor of local
      # -------------------------------------------------------------------
      - name: Sync with upstream
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/termux/termux-packages.git 2>/dev/null || \
            git remote set-url upstream https://github.com/termux/termux-packages.git

          git fetch upstream master

          # Keep our local workflow files no matter what upstream does
          git checkout master

          if ! git merge upstream/master --no-edit -m "Chore: sync with upstream termux-packages" -X ours; then
            echo ">>> Merge conflict, resolving in favor of local..."
            git checkout --ours -- .
            git add -A
            git commit -m "Chore: resolved merge conflicts during upstream sync" || true
          fi

          # Belt-and-braces: never let upstream clobber our workflows
          git checkout HEAD -- .github/workflows/ 2>/dev/null || true

      # -------------------------------------------------------------------
      # 4. Commit (if anything) + force-push to master
      # -------------------------------------------------------------------
      - name: Commit and push
        run: |
          set -euo pipefail

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "ci: sync $(date -u +%Y%m%d-%H%M%S)"
          else
            echo ">>> Nothing extra to commit."
          fi

          BRANCH="master"
          echo ">>> force-pushing to branch: ${BRANCH}"

          # Retry loop in case of a race
          for i in 1 2 3; do
            if git push --force origin "HEAD:refs/heads/${BRANCH}"; then
              echo "✔ pushed on attempt $i"
              break
            fi
            echo "push attempt $i failed; retrying in 5s"
            sleep 5
          done

          echo ">>> push succeeded"
