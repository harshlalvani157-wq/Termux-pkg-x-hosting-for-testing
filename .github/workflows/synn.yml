name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync-upstream:
    runs-on: ubuntu-latest

    steps:
      # --- your pattern: checkout with PAT (falls back to built-in token) ---
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GH_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      # --- your pattern: git identity + remote with token inline ---
      - name: Configure git for pushing
        run: |
          set -euo pipefail
          git config --local user.email "github-actions@users.noreply.github.com"
          git config --local user.name  "github-actions"
          git remote set-url origin \
            "https://x-access-token:${{ secrets.GH_PUSH_TOKEN || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git remote -v
          git --no-pager log -1 --oneline

      # --- merge upstream: keeps custom packages, protects workflows ---
      - name: Sync with upstream
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/termux/termux-packages.git 2>/dev/null || \
            git remote set-url upstream https://github.com/termux/termux-packages.git

          git fetch upstream master
          git checkout master

          # merge everything except .github/workflows
          if git merge upstream/master --no-edit -m "chore: sync with upstream" -X theirs; then
            echo ">>> clean merge"
          else
            echo ">>> conflicts — taking upstream for shared files"
            git checkout --theirs -- . 2>/dev/null || true
            git add -A
            git commit -m "chore: resolve conflicts during upstream sync" || true
          fi

          # never let upstream touch our workflows
          git checkout HEAD -- .github/workflows/ 2>/dev/null || true
          git add -A
          git diff --cached --quiet || git commit -m "chore: restore local workflow files"

      # --- your pattern: commit + force push ---
      - name: Commit and push
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo ">>> Nothing to commit."
          else
            git commit -m "ci: sync $(date -u +%Y%m%d-%H%M%S)"
          fi

          BRANCH="master"
          echo ">>> force-pushing to branch: ${BRANCH}"

          for i in 1 2 3; do
            if git push --force origin "HEAD:refs/heads/${BRANCH}"; then
              echo "✔ pushed on attempt $i"
              break
            fi
            echo "push attempt $i failed; retrying in 5s"
            sleep 5
          done

          echo ">>> push succeeded"
