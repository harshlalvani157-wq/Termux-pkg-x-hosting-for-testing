name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync-upstream:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------------------
      # 1. Checkout with PAT (falls back to built-in token)
      # -------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GH_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------------
      # 2. Configure git identity + remote with token inline
      # -------------------------------------------------------------------
      - name: Configure git for pushing
        run: |
          set -euo pipefail
          git config --local user.email "github-actions@users.noreply.github.com"
          git config --local user.name  "github-actions"
          git remote set-url origin \
            "https://x-access-token:${{ secrets.GH_PUSH_TOKEN || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"

      # -------------------------------------------------------------------
      # 3. Merge upstream. Plain merge — keeps our custom packages
      #    automatically (new files survive a merge untouched).
      # -------------------------------------------------------------------
      - name: Merge upstream
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/termux/termux-packages.git 2>/dev/null || \
            git remote set-url upstream https://github.com/termux/termux-packages.git

          git fetch upstream master
          git checkout master

          if git merge upstream/master --no-edit -m "chore: sync with upstream"; then
            echo ">>> clean merge"
          else
            echo ">>> conflicts, resolving: keep ours for .github, take upstream elsewhere"
            for f in $(git diff --name-only --diff-filter=U); do
              case "$f" in
                .github/*) git checkout --ours   -- "$f" ;;
                *)         git checkout --theirs -- "$f" ;;
              esac
            done
            git add -A
            git commit -m "chore: resolve conflicts during upstream sync"
          fi

      # -------------------------------------------------------------------
      # 4. Force push
      # -------------------------------------------------------------------
      - name: Push
        run: |
          set -euo pipefail
          git push --force-with-lease origin HEAD:refs/heads/master
