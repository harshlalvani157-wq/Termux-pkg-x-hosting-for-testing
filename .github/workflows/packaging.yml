name: Build & Release Packages

on:
  push:
    branches: [master]
    paths:
      - 'packages/**'
      - 'x11-packages/**'
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated package names to build"
        required: false
      free-space:
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    permissions:
      contents: write
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
    - uses: actions/checkout@v6
      with: { fetch-depth: 1 }

    - name: Compute release tag
      id: tag
      run: |
        TAG="$(date -u +'%Y.%m.%d-%H%M%S')"
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

    - name: Create release
      run: |
        set -euo pipefail
        TAG="${{ steps.tag.outputs.tag }}"
        gh release create "$TAG" \
          --title "Build $TAG" \
          --notes "Automated package build." \
          --target "${{ github.sha }}" \
          || { echo "::error::Failed to create release '$TAG'"; exit 1; }

  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target_arch: [aarch64]
      fail-fast: false
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
      with: { fetch-depth: 1000 }

    # =================================================================
    # 1. Rename com.termux -> app.xodos2 everywhere.
    #    This is the VHEditor-style blunt replacement. It rewrites:
    #      - properties.sh package name
    #      - hardcoded /data/data/com.termux paths in build.sh files
    #      - strings inside *.patch files
    #      - subapp identifiers (com.termux.api -> app.xodos2.api, etc.)
    #    Only .git, .github and the build output dirs are excluded.
    # =================================================================
    - name: Rename com.termux -> app.xodos2 globally
      run: |
        set -euo pipefail
        find . \
          -path ./.git -prune -false -o \
          -path ./.github -prune -false -o \
          -path ./debs -prune -false -o \
          -path ./artifacts -prune -false -o \
          -type f -print0 | \
        xargs -0 -r -n50 sed -i 's/com\.termux/app.xodos2/g'

        echo ">>> sanity: TERMUX_APP__PACKAGE_NAME"
        grep -nE '^TERMUX_APP__PACKAGE_NAME=' scripts/properties.sh
        echo ">>> remaining com.termux literals (should be none outside .git/.github)"
        grep -rIn 'com\.termux' . \
          --exclude-dir=.git --exclude-dir=.github --exclude-dir=debs \
          | head -20 || echo "    (none)"

    # =================================================================
    # 2. Patch packages/apt/build.sh:
    #      - drop termux-keyring from TERMUX_PKG_DEPENDS
    #      - write our own sources.list with [trusted=yes]
    # =================================================================
    - name: Patch apt package (custom repo + no keyring)
      run: |
        set -euo pipefail
        APT_BUILD="packages/apt/build.sh"
        [ -f "$APT_BUILD" ] || { echo "::error::$APT_BUILD not found"; exit 1; }

        python3 - <<'PY'
        import re, pathlib
        p = pathlib.Path("packages/apt/build.sh")
        s = p.read_text()
        changed = False

        # (a) Remove termux-keyring from TERMUX_PKG_DEPENDS
        def fix_depends(m):
            parts = [x.strip() for x in m.group(1).split(',')
                     if x.strip() and x.strip() != 'termux-keyring']
            return 'TERMUX_PKG_DEPENDS="' + ', '.join(parts) + '"'
        s2 = re.sub(r'TERMUX_PKG_DEPENDS="([^"]*)"', fix_depends, s, count=1)
        if s2 != s:
            s = s2
            changed = True
            print(">>> removed termux-keyring from TERMUX_PKG_DEPENDS")

        # (b) Replace the sources.list generation block.
        old_block = (
            '{\n'
            '\t\techo "# The main termux repository, with cloudflare cache"\n'
            '\t\techo "deb https://packages-cf.termux.dev/apt/termux-main/ stable main"\n'
            '\t\techo "# The main termux repository, without cloudflare cache"\n'
            '\t\techo "# deb https://packages.termux.dev/apt/termux-main/ stable main"\n'
            '\t} > $TERMUX_PREFIX/etc/apt/sources.list'
        )
        new_block = (
            '{\n'
            '\t\techo "deb [trusted=yes] https://xodiosx.github.io/Termux-pkg-x stable main"\n'
            '\t} > $TERMUX_PREFIX/etc/apt/sources.list'
        )
        if old_block in s:
            s = s.replace(old_block, new_block)
            changed = True
            print(">>> replaced full sources.list block")
        else:
            # Fallback: line-wise URL swap
            s3 = re.sub(
                r'deb https://packages-cf\.termux\.dev/apt/termux-main/?\s+stable\s+main',
                'deb [trusted=yes] https://xodiosx.github.io/Termux-pkg-x stable main',
                s,
            )
            s3 = re.sub(
                r'deb https://packages\.termux\.dev/apt/termux-main/?\s+stable\s+main',
                '# deb https://packages.termux.dev/apt/termux-main/ stable main',
                s3,
            )
            if s3 != s:
                s = s3
                changed = True
                print(">>> fallback URL swap applied")

        if changed:
            p.write_text(s)
            print(">>> patched:", p)
        else:
            print("WARNING: no changes to packages/apt/build.sh")
        PY

        echo ">>> after patch:"
        grep -n 'TERMUX_PKG_DEPENDS=' "$APT_BUILD" | head -1
        grep -A6 'termux_step_post_make_install' "$APT_BUILD" | head -12

    # =================================================================
    # 3. Point the build environment at our repo.
    # =================================================================
    - name: Override repository URL (~/.termuxrc + setup variables)
      run: |
        set -euo pipefail
        cat > "$HOME/.termuxrc" <<'EOF'
        TERMUX_REPO_PACKAGE="app.xodos2"
        TERMUX_REPO_URL=(
          https://xodiosx.github.io/Termux-pkg-x
        )
        TERMUX_REPO_DISTRIBUTION=(
          stable
        )
        TERMUX_REPO_COMPONENT=(
          main
        )
        EOF

        SETUP="scripts/build/termux_step_setup_variables.sh"
        if [ -f "$SETUP" ]; then
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("scripts/build/termux_step_setup_variables.sh")
          s = p.read_text()
          new_block = (
              'TERMUX_REPO_URL=(https://xodiosx.github.io/Termux-pkg-x)\n'
              'TERMUX_REPO_DISTRIBUTION=(stable)\n'
              'TERMUX_REPO_COMPONENT=(main)\n'
          )
          for var in ("TERMUX_REPO_URL", "TERMUX_REPO_DISTRIBUTION", "TERMUX_REPO_COMPONENT"):
              s = re.sub(rf'^{var}=\([^)]*\)\n?', '', s, flags=re.MULTILINE)
              s = re.sub(rf'^{var}=[^\n]*\n?', '', s, flags=re.MULTILINE)
          s = s.replace("TERMUX_BUILD_TUPLE=", new_block + "TERMUX_BUILD_TUPLE=", 1)
          p.write_text(s)
          print(">>> patched:", p)
          PY
          grep -nE '^TERMUX_REPO_(URL|DISTRIBUTION|COMPONENT)=' "$SETUP" || true
        fi

    - name: Patch termux_download_deb_pac.sh
      run: |
        set -euo pipefail
        TDP="scripts/build/termux_download_deb_pac.sh"
        [ -f "$TDP" ] || { echo "::error::$TDP not found"; exit 1; }
        if ! grep -q 'FORCED-BY-CI-FORCE-SOURCE-BUILD' "$TDP"; then
          sed -i '/^termux_download_deb_pac() {/a\    # FORCED-BY-CI-FORCE-SOURCE-BUILD: return failure' "$TDP"
          sed -i '/FORCED-BY-CI-FORCE-SOURCE-BUILD: return failure/a\    return 1' "$TDP"
        fi

    - name: Gather build summary
      id: build-info
      env:
        MANUAL_INPUT_PACKAGES: ${{ github.event.inputs.packages }}
      run: |
        mkdir -p ./artifacts ./debs
        touch ./debs/.placeholder
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          read -a PACKAGES <<< "${MANUAL_INPUT_PACKAGES//$'\n'/ }"
          repo_paths=$(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json)
          declare -a resolved=()
          for pkg in "${PACKAGES[@]}"; do
            [ -z "$pkg" ] && continue
            for repo_path in $repo_paths; do
              repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
              if [ -d "${repo_path}/${pkg}" ]; then
                echo "$pkg" >> ./built_${repo}_packages.txt
                for subpkg in $(find "${repo_path}/${pkg}/" -maxdepth 1 -type f -name \*.subpackage.sh | sort); do
                  echo "$(basename "${subpkg%%.subpackage.sh}")" >> ./built_${repo}_subpackages.txt
                done
                resolved+=("$pkg"); break
              fi
            done
          done
          echo ">>> resolved ${#resolved[@]}: ${resolved[*]:-<none>}"
          [ "${#resolved[@]}" -eq 0 ] && { echo "::error::None found."; exit 1; }
        fi

    - name: Lint packages
      run: |
        declare -a package_recipes=()
        for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
          repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
          [ -f "./built_${repo}_packages.txt" ] && package_recipes+=($(cat "./built_${repo}_packages.txt" | repo_path="${repo_path}" awk '{print ENVIRON["repo_path"]"/"$1"/build.sh"}'))
        done
        [[ "${#package_recipes[@]}" -gt 0 ]] && ./scripts/lint-packages.sh "${package_recipes[@]}"

    - name: Enable zram
      uses: ./.github/actions/zram
      with:
        algorithm: zstd
        size: 16G
        priority: 100
        device_name: /dev/zram0

    - name: Load Docker image
      if: ${{ steps.build-info.outputs.free-space == 'true' }}
      run: ./scripts/run-docker.sh true

    - name: Free additional disk space
      if: ${{ steps.build-info.outputs.free-space == 'true' }}
      run: ./scripts/free-space.sh

    - name: Build packages
      run: |
        declare -a packages=()
        for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
          repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
          if [ -f "./built_${repo}_packages.txt" ]; then
            packages+=($(cat "./built_${repo}_packages.txt"))
          fi
        done
        PKGS_STR="${packages[*]}"
        if [[ "${#packages[@]}" -gt 0 ]]; then
          cat > /tmp/inner-build.sh <<'INNER_EOF'
        set -e
        PREFIX=/data/data/app.xodos2/files/usr
        BUILD_ROOT=/home/builder/termux-packages
        cd "$BUILD_ROOT"
        mkdir -p "$PREFIX/var/lib/dpkg/info"
        ./build-package.sh -C -a aarch64 __PKGS_PLACEHOLDER__
        INNER_EOF
          sed -i "s|__PKGS_PLACEHOLDER__|${PKGS_STR}|g" /tmp/inner-build.sh
          ENCODED=$(base64 -w0 /tmp/inner-build.sh)
          ./scripts/run-docker.sh -d bash -c "echo '${ENCODED}' | base64 -d | bash" \
            || echo "::warning::Some packages failed to build — continuing"
        fi

    - name: Generate build artifacts
      if: always()
      run: |
        test -d termux-packages/output && mv termux-packages/output/* ./output/ 2>/dev/null || true
        for repo in $(jq --raw-output 'del(.pkg_format) | .[].name' repo.json); do
          test -f ./built_${repo}_packages.txt && mv ./built_${repo}_packages.txt ./debs/
          test -f ./built_${repo}_subpackages.txt && cat ./built_${repo}_subpackages.txt >> ./debs/built_${repo}_packages.txt && rm ./built_${repo}_subpackages.txt
          if [ -f "./debs/built_${repo}_packages.txt" ] && [ -d "output" ]; then
            while read -r pkg; do
              find output \( -name "$pkg_*.deb" -o -name "$pkg-static_*.deb" \) -type f -print0 | xargs -0r mv -t debs/
            done < <(cat "./debs/built_${repo}_packages.txt")
          fi
        done
        echo ">>> debs/ contains: $(find debs -type f -name '*.deb' | wc -l) .deb files"
        tar cf artifacts/debs-${{ matrix.target_arch }}-${{ github.sha }}.tar debs

    - name: Store *.deb files
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: debs-${{ matrix.target_arch }}-${{ github.sha }}
        path: ./artifacts

  release:
    permissions:
      contents: write
    needs: [build, prepare-release]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v6
      with: { fetch-depth: 1 }
    - uses: actions/download-artifact@v6
      with: { path: ./all-artifacts }

    - name: Extract .deb files from tarballs
      run: |
        set -euo pipefail
        mkdir -p release-debs
        shopt -s nullglob
        for archive in all-artifacts/debs-*/debs-*.tar; do
          tar xf "$archive" -C release-debs
        done
        count=$(find release-debs -type f -name '*.deb' | wc -l)
        echo ">>> found ${count} .deb files"
        [ "$count" -eq 0 ] && { echo "::error::No .deb files"; exit 1; }

    - name: Upload .deb files (serialized, with retries)
      run: |
        set -euo pipefail
        TAG="${{ needs.prepare-release.outputs.tag }}"
        mapfile -t FILES < <(find release-debs -type f -name '*.deb' | sort)
        total="${#FILES[@]}"
        i=0; failed=0
        for f in "${FILES[@]}"; do
          i=$((i + 1))
          printf '[%d/%d] %s ... ' "$i" "$total" "$(basename "$f")"
          ok=0
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" "$f" --clobber 2>/tmp/gh_err.log; then ok=1; break; fi
            if grep -qiE 'secondary rate limit|abuse|rate limit' /tmp/gh_err.log; then
              backoff=$((attempt * 15)); sleep "$backoff"
            else
              backoff=$((attempt * 3)); cat /tmp/gh_err.log || true; sleep "$backoff"
            fi
          done
          if [ "$ok" -eq 1 ]; then echo ok; else echo "FAILED: $(basename "$f")"; failed=$((failed + 1)); fi
          sleep 1
        done
        [ "$failed" -gt 0 ] && { echo "::error::${failed}/${total} failed"; exit 1; }
        echo ">>> all ${total} uploaded"
