name: releas Packages

on:
  push:
    branches:
    - master
    - dev
    - 'dev/**'
    paths:
    - 'packages/**'
    - 'root-packages/**'
    - 'x11-packages/**'
  pull_request:
    paths:
    - 'packages/**'
    - 'root-packages/**'
    - 'x11-packages/**'
  workflow_dispatch:
    inputs:
      packages:
        description: "A space-separated names of packages selected for rebuilding"
        required: true
      free-space:
        description: "Free space even if not building large package (useful when building a large number of packages)"
        type: boolean
        default: false

permissions: {} # none

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare-release:
    permissions:
      contents: write
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      timestamp: ${{ steps.tag.outputs.timestamp }}
    steps:
    - name: Checkout (shallow)
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Compute release tag
      id: tag
      run: |
        TAG="latest"
        TS="$(date -u +'%Y.%m.%d-%H%M%S')"
        echo "tag=${TAG}"       >> "$GITHUB_OUTPUT"
        echo "timestamp=${TS}"  >> "$GITHUB_OUTPUT"
        echo ">>> release tag: ${TAG}  (this run: ${TS})"

    - name: Create release if missing
      run: |
        set -euo pipefail
        TAG="${{ steps.tag.outputs.tag }}"

        if gh release view "$TAG" >/dev/null 2>&1; then
          echo ">>> release '$TAG' already exists — will overwrite its assets"
        else
          echo ">>> creating release '$TAG'"
          gh release create "$TAG" \
            --title "Build ${{ steps.tag.outputs.timestamp }}" \
            --notes "Automated package build.

        - **Last update:** ${{ steps.tag.outputs.timestamp }} UTC
        - **Commit:** \`${{ github.sha }}\`
        - **Branch:** \`${{ github.ref_name }}\`
        - **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        - **Architectures:** aarch64
        - **Packages:** \`.deb\` files. This release is updated in-place on each successful build." \
            --target "${{ github.sha }}" \
            || { echo "::error::Failed to create release '$TAG'"; exit 1; }
        fi

  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target_arch: [aarch64]
      fail-fast: false
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 1000

    - name: Gather build summary
      id: build-info
      env:
        MANUAL_INPUT_PACKAGES: ${{ github.event.inputs.packages }}
      run: |
        OLD_COMMIT="${{ github.event.before }}"
        HEAD_COMMIT="${{ github.event.after }}"
        if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git fetch origin "${BASE_REF:-master}" 2>/dev/null
          BASE_COMMIT="$(git merge-base "origin/${BASE_REF:-master}" "HEAD")"
          if [ -z "${{ github.event.pull_request.base.sha }}" ]; then
            if ! git log "$OLD_COMMIT" > /dev/null; then
              if [ "$(git branch --show-current)" = "master" ]; then
                echo "Force push detected on master branch. Unable to proceed."
                exit 1
              else
                OLD_COMMIT=$(git fetch origin master >&2; git merge-base origin/master $HEAD_COMMIT)
              fi
            fi
            echo "Processing commit range: ${OLD_COMMIT}..${HEAD_COMMIT}"
            CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "${OLD_COMMIT}" "${HEAD_COMMIT}")
          else
            echo "Processing pull request #${{ github.event.pull_request.number }}: ${BASE_COMMIT}..HEAD"
            CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "${BASE_COMMIT}" "HEAD")
          fi
        fi
        mkdir -p ./artifacts ./debs
        touch ./debs/.placeholder

        if [[ "${{ github.event_name }}" == "pull_request" && -n "$(git rev-list --merges "$(git fetch origin master >&2; git merge-base origin/master $HEAD_COMMIT)..$HEAD_COMMIT")" ]]; then
          echo "::error ::Merge commits are not allowed in pull requests.%0AYou should rebase your commits or squash them.%0Ahttps://docs.github.com/en/get-started/using-git/using-git-rebase-on-the-command-line"
          exit 1
        fi

        OLD_COMMIT="$OLD_COMMIT" HEAD_COMMIT="$HEAD_COMMIT" GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" scripts/utils/termux_reuse_pr_build_artifacts.sh "${{ github.event_name }}" "${{ matrix.target_arch }}" || true

        if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
          if grep -qiP '^\s*%ci:no-build\s*$' <(git log --format="%B" -n 1 --no-merges "HEAD"); then
            tar cf artifacts/debs-${{ matrix.target_arch }}.tar debs
            echo "[!] Force exiting as tag '%ci:no-build' was applied to HEAD commit message."
            exit 0
          fi

          for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
            repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
            while read -r file; do
              if ! [[ $file == ${repo_path}/* ]]; then
                continue
              fi
              if [[ $file =~ ^${repo_path}/([.a-z0-9+-]*)/([.a-z0-9+-]*).subpackage.sh$ ]]; then
                pkg=${BASH_REMATCH[1]}
                subpkg=${BASH_REMATCH[2]}
                if [ ! -f "${repo_path}/${pkg}/${subpkg}.subpackage.sh" ]; then
                  echo "$subpkg" >> ./deleted_${repo}_packages.txt
                fi
              elif [[ $file =~ ^${repo_path}/([.a-z0-9+-]*)/.*$ ]]; then
                pkg=${BASH_REMATCH[1]}
                if [ -d "${repo_path}/${pkg}" ]; then
                  echo "$pkg" >> ./built_${repo}_packages.txt
                  for file in $(find "${repo_path}/${pkg}/" -maxdepth 1 -type f -name \*.subpackage.sh | sort); do
                    echo "$(basename "${file%%.subpackage.sh}")" >> ./built_${repo}_subpackages.txt
                  done
                else
                  echo "$pkg" >> ./deleted_${repo}_packages
                fi
              fi
            done<<<${CHANGED_FILES}
          done
        else
          read -a PACKAGES <<< "${MANUAL_INPUT_PACKAGES//$'\n'/ }"
          repo_paths=$(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json)

          declare -a resolved=()
          declare -a missing=()

          for pkg in "${PACKAGES[@]}"; do
            [ -z "$pkg" ] && continue
            found=false

            for repo_path in $repo_paths; do
              repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
              if [ -d "${repo_path}/${pkg}" ]; then
                found=true
                echo "$pkg" >> ./built_${repo}_packages.txt
                for subpkg in $(find "${repo_path}/${pkg}/" -maxdepth 1 -type f -name \*.subpackage.sh | sort); do
                  echo "$(basename "${subpkg%%.subpackage.sh}")" >> ./built_${repo}_subpackages.txt
                done
                resolved+=("$pkg")
                break
              fi
            done
            [ "$found" = true ] && continue

            for repo_path in $repo_paths; do
              repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
              subfile=$(find "${repo_path}" -mindepth 2 -maxdepth 2 -type f \
                          -name "${pkg}.subpackage.sh" -print -quit 2>/dev/null || true)
              if [ -n "$subfile" ]; then
                parent=$(basename "$(dirname "$subfile")")
                echo ">>> '${pkg}' is a subpackage of '${parent}' — building '${parent}' instead"
                found=true
                echo "$parent" >> ./built_${repo}_packages.txt
                for s in $(find "${repo_path}/${parent}/" -maxdepth 1 -type f -name \*.subpackage.sh | sort); do
                  echo "$(basename "${s%%.subpackage.sh}")" >> ./built_${repo}_subpackages.txt
                done
                resolved+=("$pkg -> $parent")
                break
              fi
            done
            [ "$found" = true ] && continue

            missing+=("$pkg")
            echo "::warning::Package '${pkg}' not found in any repo or as a subpackage — skipping"
          done

          echo ">>> resolved ${#resolved[@]} package(s): ${resolved[*]:-<none>}"
          if [ "${#missing[@]}" -gt 0 ]; then
            echo ">>> skipped ${#missing[@]} unknown name(s): ${missing[*]}"
          fi

          if [ "${#resolved[@]}" -eq 0 ]; then
            echo "::error::None of the requested packages were found. Aborting."
            exit 1
          fi
        fi

        for repo in $(jq --raw-output 'del(.pkg_format) | .[].name' repo.json); do
          if [ -f ./built_${repo}_packages.txt ]; then
            sort ./built_${repo}_packages.txt | uniq > ./built_${repo}_packages.txt.tmp
            mv ./built_${repo}_packages.txt.tmp ./built_${repo}_packages.txt
          fi
          if [ -f ./built_${repo}_subpackages.txt ]; then
            sort ./built_${repo}_subpackages.txt | uniq > ./built_${repo}_subpackages.txt.tmp
            mv ./built_${repo}_subpackages.txt.tmp ./built_${repo}_subpackages.txt
          fi
          if [ -f ./deleted_${repo}_packages.txt ]; then
            sort ./deleted_${repo}_packages.txt | uniq > ./deleted_${repo}_packages.txt.tmp
            mv ./deleted_${repo}_packages.txt.tmp ./deleted_${repo}_packages.txt
          fi
        done

        declare -a packages=()
        for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
          repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
          if [ -f "./built_${repo}_packages.txt" ]; then
            packages+=($(cat "./built_${repo}_packages.txt"))
          fi
        done

        echo "packages: ${packages[*]}"

        free_space='false'
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          free_space=${{ github.event.inputs.free-space }}
        else
          if grep -qiP '^\s*%ci:free-disk\s*$' <(git log --format="%B" -n 1 --no-merges "HEAD"); then
            free_space=true
          fi
        fi
        if [[ "${#packages[@]}" -gt 0 ]]; then
          for pkg in "${packages[@]}"; do
            if grep -qFx "$pkg" ./scripts/big-pkgs.list; then
              free_space='true'
              break
            fi
          done
        fi
        echo "free-space=$free_space" >> $GITHUB_OUTPUT

        needs_docker_build=false
        if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
          if grep -qP '^scripts/(Dockerfile|properties\.sh|setup-android-sdk\.sh|setup-ubuntu\.sh)$' <<< "$CHANGED_FILES"; then
            needs_docker_build=true
          fi
        fi
        echo "needs-docker-build=$needs_docker_build" >> $GITHUB_OUTPUT

    - name: Lint packages
      run: |
        declare -a package_recipes=()
        for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
          repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
          if [ -f "./built_${repo}_packages.txt" ]; then
            package_recipes+=($(cat "./built_${repo}_packages.txt" | repo_path="${repo_path}" awk '{print ENVIRON["repo_path"]"/"$1"/build.sh"}'))
          fi
        done

        if [[ "${#package_recipes[@]}" -gt 0 ]]; then
          ./scripts/lint-packages.sh "${package_recipes[@]}"
        fi

    - name: Enable zram
      if: ${{ steps.build-info.outputs.skip-building != 'true' }}
      uses: ./.github/actions/zram
      with:
        algorithm: zstd
        size: 16G
        priority: 100
        device_name: /dev/zram0

    - name: Build docker image
      if: ${{ steps.build-info.outputs.needs-docker-build == 'true' }}
      run: |
        docker build -t ghcr.io/termux/package-builder:latest scripts/
        docker buildx prune -af

    - name: Load Docker image
      if: ${{ steps.build-info.outputs.free-space == 'true' && steps.build-info.outputs.skip-building != 'true' }}
      run: |
        ./scripts/run-docker.sh true

    - name: Free additional disk space (if needed)
      if: ${{ steps.build-info.outputs.free-space == 'true' && steps.build-info.outputs.skip-building != 'true' }}
      run: |
        ./scripts/free-space.sh

    - name: Download pre-built dependencies
      if: ${{ steps.build-info.outputs.skip-building != 'true' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        mkdir -p debs-deps
        echo ">>> Downloading pre-built .deb files from release 2026.10.03-230607"
        gh release download 2026.10.03-230607 \
          -p "*.deb" \
          -D debs-deps \
          --repo "${{ github.repository }}" \
          || echo "::warning::No .deb assets found in that release."
        echo ">>> Downloaded $(find debs-deps -name '*.deb' | wc -l) .deb files."

    - name: Build packages
      if: ${{ steps.build-info.outputs.skip-building != 'true' }}
      run: |
        declare -a packages=()
        for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
          repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
          if [ -f "./built_${repo}_packages.txt" ]; then
            packages+=($(cat "./built_${repo}_packages.txt"))
          fi
        done

        PKGS_STR="${packages[*]}"
        echo "packages: ${PKGS_STR}"

        if [[ "${#packages[@]}" -gt 0 ]]; then
          cat > /tmp/inner-build.sh <<'INNER_EOF'
        set -e

        PREFIX=/data/data/app.xodos2/files/usr

        # Make sure the prefix and dpkg admindir exist
        sudo mkdir -p "$PREFIX/var/lib/dpkg/info"
        sudo chown -R "$(id -u):$(id -g)" "$PREFIX"

        # Locate the debs-deps directory (mount points vary)
        DEBS_DIR=""
        for candidate in \
          "$PWD/debs-deps" \
          ./debs-deps \
          /home/builder/termux-packages/debs-deps \
          /root/termux-packages/debs-deps \
          /tmp/debs-deps \
          /workspace/debs-deps \
          /github/workspace/debs-deps \
        ; do
          if [ -d "$candidate" ] && ls "$candidate"/*.deb >/dev/null 2>&1; then
            DEBS_DIR="$candidate"
            break
          fi
        done

        if [ -z "$DEBS_DIR" ]; then
          echo ">>> WARNING: debs-deps not found."
          echo ">>> CWD: $(pwd)"
          ls -la | head -40
          find / -maxdepth 6 -type d -name debs-deps 2>/dev/null || true
        else
          echo ">>> Found debs-deps at: $DEBS_DIR"
          echo ">>> Sample paths inside first .deb:"
          first_deb=$(ls "$DEBS_DIR"/*.deb | head -1)
          dpkg-deb -c "$first_deb" 2>/dev/null | head -8 || true

          echo ""
          echo ">>> Installing via dpkg -i (admindir=$PREFIX/var/lib/dpkg, instdir=/)"
          # -i installs each .deb, --instdir=/ extracts to absolute paths
          # (which are already correct inside each package), --admindir puts
          # the status / info files under the Termux prefix where
          # build-package.sh looks for them.
          # --force-depends so ordering doesn't matter.
          # --force-overwrite in case the image already has some files.
          sudo dpkg \
            --admindir="$PREFIX/var/lib/dpkg" \
            --instdir=/ \
            --force-depends \
            --force-overwrite \
            -i "$DEBS_DIR"/*.deb \
            || true

          echo ""
          echo ">>> Sanity check — registered packages:"
          if [ -f "$PREFIX/var/lib/dpkg/status" ]; then
            echo "  status file entries: $(grep -c '^Package:' "$PREFIX/var/lib/dpkg/status" || echo 0)"
          else
            echo "  status file MISSING"
          fi

          for c in libandroid-wordexp libbz2 libiconv libc++; do
            if [ -f "$PREFIX/var/lib/dpkg/info/${c}.list" ]; then
              echo "  ${c}.list OK ($(wc -l < "$PREFIX/var/lib/dpkg/info/${c}.list") entries)"
            else
              echo "  ${c}.list MISSING"
            fi
          done

          echo ""
          echo ">>> Sanity check — binaries on disk:"
          for b in bash bzip2; do
            if [ -x "$PREFIX/bin/$b" ]; then
              echo "  $PREFIX/bin/$b OK"
            else
              echo "  $PREFIX/bin/$b MISSING"
            fi
          done
        fi

        echo ""
        echo ">>> Building: __PKGS_PLACEHOLDER__"
        echo ""

        ./build-package.sh -C -a aarch64 __PKGS_PLACEHOLDER__
        INNER_EOF

          sed -i "s|__PKGS_PLACEHOLDER__|${PKGS_STR}|g" /tmp/inner-build.sh

          echo ">>> inner-build.sh content:"
          cat /tmp/inner-build.sh
          echo ">>> ---"

          ENCODED=$(base64 -w0 /tmp/inner-build.sh)
          ./scripts/run-docker.sh -d bash -c "echo '${ENCODED}' | base64 -d | bash" || \
            echo "::warning::Some packages failed to build for ${{ matrix.target_arch }} — continuing so the successful ones can still be uploaded and released"
        fi

    - name: Generate build artifacts
      if: always()
      run: |
        test -d termux-packages/output && mv termux-packages/output/* ./output/

        for repo in $(jq --raw-output 'del(.pkg_format) | .[].name' repo.json); do
          test -f ./built_${repo}_packages.txt && mv ./built_${repo}_packages.txt ./debs/
          test -f ./built_${repo}_subpackages.txt && cat ./built_${repo}_subpackages.txt >> ./debs/built_${repo}_packages.txt \
            && rm ./built_${repo}_subpackages.txt
          test -f ./deleted_${repo}_packages.txt && mv ./deleted_${repo}_packages.txt ./debs/

          if [ -f "./debs/built_${repo}_packages.txt" ] && [ -d "output" ]; then
            while read -r pkg; do
              find output \( -name "$pkg_*.deb" -o -name "$pkg-static_*.deb" \) -type f -print0 | xargs -0r mv -t debs/
            done < <(cat "./debs/built_${repo}_packages.txt")
          fi
        done

        tar cf artifacts/debs-${{ matrix.target_arch }}-${{ github.sha }}.tar debs

    - name: Checksums for built *.deb files
      if: always()
      run: |
        find debs -type f -name "*.deb" -exec sha256sum "{}" \; | sort -k2 | tee checksum-${{ matrix.target_arch }}-${{ github.sha }}.txt

    - name: Store checksums for built *.deb files
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: checksum-${{ matrix.target_arch }}-${{ github.sha }}
        path: checksum-${{ matrix.target_arch }}-${{ github.sha }}.txt

    - name: Store *.deb files
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: debs-${{ matrix.target_arch }}-${{ github.sha }}
        path: ./artifacts

    - name: AppArmor Logs
      if: always()
      run: |
        sudo dmesg | grep apparmor

  test-buildorder-random:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
    - name: Randomise buildorder.py test
      run: ./scripts/bin/test-buildorder-random
    - name: Randomise buildorder.py test (aarch64)
      env:
        TERMUX_ARCH: aarch64
      run: ./scripts/bin/test-buildorder-random
    - name: Randomise buildorder.py test (arm)
      env:
        TERMUX_ARCH: arm
      run: ./scripts/bin/test-buildorder-random
    - name: Randomise buildorder.py test (i686)
      env:
        TERMUX_ARCH: i686
      run: ./scripts/bin/test-buildorder-random
    - name: Randomise buildorder.py test (x86_64)
      env:
        TERMUX_ARCH: x86_64
      run: ./scripts/bin/test-buildorder-random

  upload-test:
    permissions:
      contents: read
    if: github.repository == 'termux/termux-packages' && github.ref != 'refs/heads/master'
    needs: build
    runs-on: ubuntu-slim
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
    - name: Get *.deb files
      uses: actions/download-artifact@v7
      with:
        path: ./
    - name: Check packages using Packages.bz2
      run: |
        if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
          if grep -qiP '^\s*%ci:no-build\s*$' <(git log --format="%B" -n 1 --no-merges "HEAD"); then
            echo "[!] Force exiting as tag '%ci:no-build' was applied to HEAD commit message."
            exit 0
          fi
        fi

        for archive in debs-*/debs-{aarch64,arm,i686,x86_64}-${{ github.sha }}.tar; do
          tar xf "$archive"
        done

        error=0
        for repo in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
          name=$(jq --raw-output '.["'${repo}'"].name' repo.json)
          distribution=$(jq --raw-output '.["'${repo}'"].distribution' repo.json)
          component=$(jq --raw-output '.["'${repo}'"].component' repo.json)
          url=$(jq --raw-output '.["'${repo}'"].url' repo.json)

          if [ ! -f debs/built_${name}_packages.txt ]; then
            continue
          fi
          if [ -z "$(cat debs/built_${name}_packages.txt)" ]; then
            continue
          fi

          for arch in aarch64 arm i686 x86_64; do
            if [ ! -f "Packages-${repo}-${arch}" ]; then
              echo "[*] Downloading ${url}/dists/${distribution}/${component}/binary-${arch}/Packages.bz2"
              curl -s \
                --user-agent 'Termux-Packages/1.0\ (https://github.com/termux/termux-packages)' \
                "${url}/dists/${distribution}/${component}/binary-${arch}/Packages.bz2" \
                -o "Packages-${repo}-${arch}.bz2"
              7z x "Packages-${repo}-${arch}.bz2" > /dev/null
            fi
            result=$(find debs -maxdepth 1 -type f | cut -d"/" -f2 | xargs -P$(nproc) -i{} grep "^Filename:.*/{}$" -nH "Packages-${repo}-${arch}" || true)
            if [ -n "$result" ]; then
              echo "$result" | grep -E "${arch}|all" || true
              error=1
            fi
          done
        done
        if [ "$error" != 0 ]; then
          echo "[!] Found local files same name with server files!"
          echo "[!] Please revbump package, rebase or tag commit with '%ci:no-build'"
          exit 1
        fi

  upload:
    concurrency: ${{ github.workflow }}
    permissions:
      contents: read
    if: github.repository == 'termux/termux-packages' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-slim
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
    - name: Get *.deb files
      uses: actions/download-artifact@v7
      with:
        path: ./
    - name: Upload to packages.termux.dev
      env:
        REPOSITORY_URL: https://packages.termux.dev/aptly-api
        GITHUB_SHA: ${{ github.sha }}
        APTLY_API_AUTH: ${{ secrets.APTLY_API_AUTH }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        source scripts/aptly_api.sh

        for archive in debs-*/debs-{aarch64,arm,i686,x86_64}-${{ github.sha }}.tar; do
          tar xf "$archive"
        done

        for repo in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
          export REPOSITORY_NAME=$(jq --raw-output '.["'$repo'"].name' repo.json)
          export REPOSITORY_DISTRIBUTION=$(jq --raw-output '.["'$repo'"].distribution' repo.json)

          uploaded_files=false
          shopt -s nullglob

          if [ -f debs/built_${REPOSITORY_NAME}_packages.txt ]; then
            for filename in $(cat debs/built_${REPOSITORY_NAME}_packages.txt | sed -E 's/(..*)/debs\/\1_\*.deb debs\/\1-static_\*.deb/g'); do
              if ! aptly_upload_file "$filename"; then
                exit 1
              fi
              uploaded_files=true
            done
            shopt -u nullglob

            if [ "$uploaded_files" = "true" ]; then
              if ! aptly_add_to_repo; then
                exit 1
              fi
              aptly_delete_dir
              if ! aptly_publish_repo; then
                exit 1
              fi
            fi
          fi
        done

  release:
    permissions:
      contents: write
    needs: [build, prepare-release]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Update release notes (title + body with latest run info)
      run: |
        set -euo pipefail
        TAG="${{ needs.prepare-release.outputs.tag }}"
        gh release edit "$TAG" \
          --title "Build ${{ needs.prepare-release.outputs.timestamp }}" \
          --notes "Automated package build.

        - **Last update:** ${{ needs.prepare-release.outputs.timestamp }} UTC
        - **Commit:** \`${{ github.sha }}\`
        - **Branch:** \`${{ github.ref_name }}\`
        - **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        - **Architectures:** aarch64
        - **Packages:** \`.deb\` files. This release is updated in-place on each successful build."

    - name: Download all artifacts
      uses: actions/download-artifact@v7
      with:
        path: ./all-artifacts

    - name: Extract .deb files from tarballs
      run: |
        set -euo pipefail
        mkdir -p release-debs
        shopt -s nullglob

        found=0
        for archive in all-artifacts/debs-*/debs-*.tar; do
          echo ">>> extracting $archive"
          tar xf "$archive" -C release-debs
          found=1
        done

        if [ "$found" -eq 0 ]; then
          echo "::error::No debs-*.tar artifacts were found to release."
          exit 1
        fi

        count=$(find release-debs -type f -name '*.deb' | wc -l)
        echo ">>> found ${count} .deb files"
        if [ "$count" -eq 0 ]; then
          echo "::error::No .deb files inside the artifacts — nothing to release."
          exit 1
        fi

        echo ">>> sample of what will be published:"
        find release-debs -type f -name '*.deb' -printf '%f\n' | sort | head -20

    - name: Upload .deb files (serialized, with retries)
      run: |
        set -euo pipefail
        TAG="${{ needs.prepare-release.outputs.tag }}"

        mapfile -t FILES < <(find release-debs -type f -name '*.deb' | sort)
        total="${#FILES[@]}"
        echo ">>> uploading ${total} files serially into release '${TAG}'"

        i=0
        failed=0
        for f in "${FILES[@]}"; do
          i=$((i + 1))
          name="$(basename "$f")"
          printf '[%d/%d] %s ... ' "$i" "$total" "$name"

          ok=0
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" "$f" --clobber 2>/tmp/gh_err.log; then
              ok=1
              break
            fi
            if grep -qiE 'secondary rate limit|abuse|rate limit' /tmp/gh_err.log; then
              backoff=$((attempt * 15))
              echo
              echo "  ↳ rate limited, sleeping ${backoff}s (attempt ${attempt}/5)"
              sleep "$backoff"
            else
              backoff=$((attempt * 3))
              echo
              echo "  ↳ upload failed, retrying in ${backoff}s (attempt ${attempt}/5)"
              cat /tmp/gh_err.log || true
              sleep "$backoff"
            fi
          done

          if [ "$ok" -eq 1 ]; then
            echo "ok"
          else
            echo "FAILED: $name"
            failed=$((failed + 1))
          fi

          sleep 1
        done

        if [ "$failed" -gt 0 ]; then
          echo "::error::${failed} of ${total} files failed to upload after 5 attempts"
          exit 1
        fi

        echo ">>> all ${total} files uploaded successfully"

    - name: Verify release assets
      run: |
        set -euo pipefail
        TAG="${{ needs.prepare-release.outputs.tag }}"
        count=$(gh release view "$TAG" --json assets --jq '.assets | length')
        echo ">>> release ${TAG} has ${count} assets"
