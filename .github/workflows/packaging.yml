    - name: Build packages
      if: ${{ steps.build-info.outputs.skip-building != 'true' }}
      run: |
        declare -a packages=()
        for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
          repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
          if [ -f "./built_${repo}_packages.txt" ]; then
            packages+=($(cat "./built_${repo}_packages.txt"))
          fi
        done

        PKGS_STR="${packages[*]}"
        echo "packages: ${PKGS_STR}"

        if [[ "${#packages[@]}" -gt 0 ]]; then
          ./scripts/run-docker.sh -d bash -c '
set -e

PREFIX=/data/data/app.xodos2/files/usr
mkdir -p "$PREFIX" 2>/dev/null || {
  sudo mkdir -p "$PREFIX" 2>/dev/null || { echo "ERROR: cannot create $PREFIX"; exit 1; }
  sudo chown -R "$(id -u):$(id -g)" "$PREFIX"
}
mkdir -p "$PREFIX/var/lib/dpkg/info"
: > "$PREFIX/var/lib/dpkg/status"

DEBS_DIR=""
for candidate in "$PWD/debs-deps" ./debs-deps /home/builder/termux-packages/debs-deps /root/termux-packages/debs-deps /workspace/debs-deps /github/workspace/debs-deps; do
  if [ -d "$candidate" ] && ls "$candidate"/*.deb >/dev/null 2>&1; then
    DEBS_DIR="$candidate"
    break
  fi
done

if [ -z "$DEBS_DIR" ]; then
  echo "WARNING: debs-deps not found"
  echo "PWD: $(pwd)"
  ls -la | head -40
  find / -maxdepth 6 -type d -name debs-deps 2>/dev/null || true
else
  echo "Found debs-deps at: $DEBS_DIR"
  shopt -s nullglob
  count=0
  for deb in "$DEBS_DIR"/*.deb; do
    pkg=$(dpkg-deb -f "$deb" Package)
    ver=$(dpkg-deb -f "$deb" Version)
    arch=$(dpkg-deb -f "$deb" Architecture)
    dpkg-deb -x "$deb" "$PREFIX"
    dpkg-deb --fsys-tarfile "$deb" | tar -tf - | grep -v "/$" | sed "s|^\./|$PREFIX/|" > "$PREFIX/var/lib/dpkg/info/${pkg}.list"
    {
      echo "Package: $pkg"
      echo "Status: install ok installed"
      echo "Priority: optional"
      echo "Section: misc"
      echo "Installed-Size: 1"
      echo "Maintainer: builder"
      echo "Architecture: $arch"
      echo "Version: $ver"
      echo "Description: pre-built dependency"
      echo ""
    } >> "$PREFIX/var/lib/dpkg/status"
    count=$((count + 1))
  done
  echo "Installed and registered $count pre-built packages"
fi

echo ""
echo "Building: '"${PKGS_STR}"'"
echo ""

./build-package.sh -C -a aarch64 '"${PKGS_STR}"'
' || \
            echo "::warning::Some packages failed to build for ${{ matrix.target_arch }} — continuing so the successful ones can still be uploaded and released"
        fi
