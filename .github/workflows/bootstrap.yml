name: Generate bootstrap XoDos

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to pull .deb files from (leave empty for latest)"
        required: false
        default: ""
      arch:
        description: "Comma-separated architectures, or 'all'"
        required: false
        default: "all"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      archs: ${{ steps.pick.outputs.archs }}
    steps:
      - name: Pick release tag + arches
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(gh release list --repo "${{ github.repository }}" --limit 200 \
              --json tagName,createdAt \
              --jq '[.[] | select(.tagName | startswith("bootstrap-") | not)] | sort_by(.createdAt) | last | .tagName')"
          fi
          [ -n "$TAG" ] && [ "$TAG" != "null" ] || { echo "::error::No suitable release found"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo ">>> Using release tag: $TAG"

          if [ -z "$INPUT_ARCH" ] || [ "$INPUT_ARCH" = "all" ]; then
            ARCHS='["aarch64","arm","i686","x86_64"]'
          else
            ARCHS=$(printf '%s' "$INPUT_ARCH" | python3 -c 'import sys, json; print(json.dumps([a.strip() for a in sys.stdin.read().split(",") if a.strip()]))')
          fi
          echo "archs=$ARCHS" >> "$GITHUB_OUTPUT"
          echo ">>> Arches: $ARCHS"

  build:
    needs: resolve
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: ${{ fromJson(needs.resolve.outputs.archs) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with: { fetch-depth: 1 }

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev

      - name: Download .deb files from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf ./all-debs
          mkdir -p ./all-debs
          echo ">>> Downloading all .deb files from release ${RELEASE_TAG}"
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.deb" \
            --dir ./all-debs
          echo ">>> downloaded: $(find ./all-debs -name '*.deb' | wc -l) files"

      - name: Filter to essential packages
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          # Essentials for a working Termux environment.
          # termux-keyring is intentionally excluded — we disable signing.
          ESSENTIALS="apt bash bash-completion bzip2 ca-certificates coreutils curl dash diffutils dpkg ed findutils gawk grep gzip inetutils less libandroid-support libbz2 libc++ libcap libcurl libexpat libgcrypt libgmp libgnutls libgpg-error libiconv liblzma libmd libmpfr libnettle libnghttp2 libnpth libsqlite libssh2 libunistring libxml2 lz4 ncurses ncurses-utils openssl openssl-tool patch procps psmisc readline resolv-conf sed tar termux-am termux-am-socket termux-core termux-exec termux-licenses termux-tools unzip util-linux xz-utils zlib zstd"

          mkdir -p debs
          kept=0
          skipped=0
          shopt -s nullglob
          for deb in all-debs/*.deb; do
            pkg=$(dpkg-deb -f "$deb" Package 2>/dev/null || echo "")
            arch=$(dpkg-deb -f "$deb" Architecture 2>/dev/null || echo "")
            [ -z "$pkg" ] && { skipped=$((skipped+1)); continue; }
            [ "$arch" = "all" ] || [ "$arch" = "$ARCH" ] || { skipped=$((skipped+1)); continue; }
            if printf '%s\n' $ESSENTIALS | grep -Fxq "$pkg"; then
              cp "$deb" debs/
              kept=$((kept+1))
            fi
          done
          shopt -u nullglob
          echo ">>> kept=$kept skipped=$skipped"
          ls -la debs/ | head

      - name: Extract into staging prefix
        run: |
          set -euo pipefail
          STAGING=staging
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          shopt -s nullglob
          for deb in debs/*.deb; do
            pkg=$(dpkg-deb -f "$deb" Package)
            tmpdir=$(mktemp -d)
            dpkg-deb -x "$deb" "$tmpdir"
            prefix_dir="$tmpdir/data/data/app.xodos2/files/usr"
            if [ -d "$prefix_dir" ]; then
              cp -a "$prefix_dir/." "$STAGING/"
            else
              # Fallback: try com.termux (in case an older .deb slipped in)
              prefix_dir="$tmpdir/data/data/com.termux/files/usr"
              if [ -d "$prefix_dir" ]; then
                echo ">>> NOTE: $pkg still uses com.termux paths; rewriting"
                cp -a "$prefix_dir/." "$STAGING/"
                grep -rl '/data/data/com.termux' "$STAGING" 2>/dev/null | while read -r f; do
                  sed -i 's|/data/data/com\.termux|/data/data/app.xodos2|g' "$f"
                done || true
              fi
            fi
            rm -rf "$tmpdir"
          done
          shopt -u nullglob

          echo ">>> staging top-level:"
          ls -la "$STAGING"

      - name: Write sources.list
        run: |
          set -euo pipefail
          mkdir -p staging/etc/apt/sources.list.d
          rm -f staging/etc/apt/sources.list
          rm -f staging/etc/apt/sources.list.d/*.list 2>/dev/null || true
          cat > staging/etc/apt/sources.list <<'EOF'
          deb [trusted=yes] https://xodiosx.github.io/Termux-pkg-x stable main
          EOF
          echo ">>> sources.list:"
          cat staging/etc/apt/sources.list

      - name: Disable signature verification + strip keyring
        run: |
          set -euo pipefail
          # Drop any keyring packages' files that might have slipped in
          rm -rf staging/etc/apt/trusted.gpg.d 2>/dev/null || true
          rm -rf staging/share/termux-keyring   2>/dev/null || true
          rm -rf staging/etc/termux-keyring     2>/dev/null || true

          # Global "accept unsigned" config
          mkdir -p staging/etc/apt/apt.conf.d
          cat > staging/etc/apt/apt.conf.d/99-insecure <<'EOF'
          Acquire::AllowInsecureRepositories "true";
          Acquire::AllowDowngradeToInsecureRepositories "true";
          APT::Get::AllowUnauthenticated "true";
          EOF

          echo ">>> apt.conf.d:"
          ls staging/etc/apt/apt.conf.d/

      - name: Fix any lingering com.termux paths in scripts
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -rl '/data/data/com\.termux' staging/ 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo ">>> no /data/data/com.termux references"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo ">>> patching $f"
            sed -i 's|/data/data/com\.termux|/data/data/app.xodos2|g' "$f"
          done

      - name: Create tar.xz
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cd staging
          tar --numeric-owner -cJf "../bootstrap-${ARCH}.tar.xz" .
          cd ..
          ls -la "bootstrap-${ARCH}.tar.xz"
          sha256sum "bootstrap-${ARCH}.tar.xz" > "bootstrap-${ARCH}.tar.xz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: bootstrap-${{ matrix.arch }}-${{ github.sha }}
          path: |
            bootstrap-*.tar.xz
            bootstrap-*.tar.xz.sha256

  publish:
    needs: [resolve, build]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          merge-multiple: true
          path: ./

      - name: Create release
        id: tag
        run: |
          set -euo pipefail
          TAG="bootstrap-$(date -u +'%Y.%m.%d-%H%M%S')"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Bootstrap archives $TAG" \
            --notes "Prebuilt \`app.xodos2\` bootstrap archives (plain .tar.xz). Extract directly into \$PREFIX." \
            --target "${{ github.sha }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload bootstrap archives
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          shopt -s nullglob
          files=(bootstrap-*.tar.xz bootstrap-*.tar.xz.sha256)
          for f in "${files[@]}"; do
            echo ">>> uploading $f"
            gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber
          done
          echo ">>> release ${TAG} assets:"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name'
