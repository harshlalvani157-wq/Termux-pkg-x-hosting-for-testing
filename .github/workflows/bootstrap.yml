name: Generate bootstrap XoDos 

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to pull .deb files from (leave empty for latest with .deb assets)"
        required: false
        default: ""
      arch:
        description: "Comma-separated arch list, or 'all'"
        required: false
        default: "all"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      archs: ${{ steps.pick.outputs.archs }}
    steps:
      - name: Pick release tag + arches
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail

          pick_tag_with_debs() {
            # Emit the newest non-bootstrap release whose assets include *.deb
            gh api "repos/${{ github.repository }}/releases?per_page=100" \
              --jq '.[]
                     | select(.tag_name | startswith("bootstrap-") | not)
                     | select([.assets[].name] | any(endswith(".deb")))
                     | .tag_name' \
              | head -1
          }

          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            # Verify it actually has .deb assets
            count=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" \
                      --jq '[.assets[].name] | map(select(endswith(".deb"))) | length' 2>/dev/null || echo "0")
            if [ "$count" = "0" ] || [ -z "$count" ]; then
              echo "::error::Release '${TAG}' has no .deb assets"
              gh release view "$TAG" --repo "${{ github.repository }}" \
                --json assets --jq '.assets[].name' || true
              exit 1
            fi
            echo ">>> Using user-provided tag: $TAG (${count} .deb assets)"
          else
            TAG="$(pick_tag_with_debs)"
            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              echo "::error::No release with .deb assets found in this repo."
              echo ">>> Available releases:"
              gh release list --repo "${{ github.repository }}" --limit 20 || true
              exit 1
            fi
            echo ">>> Auto-selected newest release with .deb assets: $TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ -z "$INPUT_ARCH" ] || [ "$INPUT_ARCH" = "all" ]; then
            ARCHS='["aarch64","arm","i686","x86_64"]'
          else
            ARCHS=$(printf '%s' "$INPUT_ARCH" | python3 -c 'import sys, json; print(json.dumps([a.strip() for a in sys.stdin.read().split(",") if a.strip()]))')
          fi
          echo "archs=$ARCHS" >> "$GITHUB_OUTPUT"
          echo ">>> Arches: $ARCHS"

  build:
    needs: resolve
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: ${{ fromJson(needs.resolve.outputs.archs) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with: { fetch-depth: 1 }

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev python3

      - name: Download .deb files from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf ./all-debs
          mkdir -p ./all-debs
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.deb" \
            --dir ./all-debs
          n=$(find ./all-debs -name '*.deb' | wc -l)
          echo ">>> downloaded: ${n} files"
          if [ "$n" -eq 0 ]; then
            echo "::error::No .deb files downloaded from release ${RELEASE_TAG}"
            exit 1
          fi

      - name: Resolve dependency closure
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import subprocess, os, sys
          from collections import defaultdict

          ARCH = os.environ["ARCH"]
          deb_dir = "all-debs"

          essentials = [
              "apt", "bash", "bash-completion", "bzip2", "ca-certificates",
              "coreutils", "curl", "dash", "diffutils", "dpkg", "ed",
              "findutils", "gawk", "grep", "gzip", "inetutils", "less",
              "libandroid-support", "libbz2", "libc++", "libcap", "libcurl",
              "libexpat", "libgcrypt", "libgmp", "libgnutls", "libgpg-error",
              "libiconv", "liblzma", "libmd", "libmpfr", "libnettle",
              "libnghttp2", "libnpth", "libsqlite", "libssh2", "libunistring",
              "libxml2", "lz4", "ncurses", "ncurses-utils", "openssl",
              "openssl-tool", "patch", "procps", "psmisc", "readline",
              "resolv-conf", "sed", "tar", "termux-am", "termux-am-socket",
              "termux-core", "termux-exec", "termux-licenses", "termux-tools",
              "unzip", "util-linux", "xz-utils", "zlib", "zstd",
          ]

          def dpkg_field(path, field):
              try:
                  out = subprocess.check_output(
                      ["dpkg-deb", "-f", path, field],
                      stderr=subprocess.DEVNULL,
                  ).decode().strip()
                  return out
              except subprocess.CalledProcessError:
                  return ""

          pkg_info = {}
          provides_map = defaultdict(list)
          for f in sorted(os.listdir(deb_dir)):
              if not f.endswith(".deb"):
                  continue
              path = os.path.join(deb_dir, f)
              name = dpkg_field(path, "Package")
              if not name:
                  continue
              arch = dpkg_field(path, "Architecture")
              depends_raw = dpkg_field(path, "Depends") or dpkg_field(path, "Pre-Depends")
              provides_raw = dpkg_field(path, "Provides")

              def parse_list(raw):
                  out = []
                  for part in raw.split(","):
                      part = part.strip()
                      if not part:
                          continue
                      first = part.split("|")[0].strip()
                      first = first.split("(")[0].strip()
                      if first:
                          out.append(first)
                  return out

              deps = parse_list(depends_raw)
              provides = parse_list(provides_raw)

              pkg_info[name] = {
                  "path": path,
                  "arch": arch,
                  "depends": deps,
                  "provides": provides,
              }
              for p in provides:
                  provides_map[p].append(name)

          for name, info in pkg_info.items():
              if name.startswith("lib"):
                  if info["arch"] == "all" or info["arch"] == ARCH:
                      if name not in essentials:
                          essentials.append(name)

          needed = set()
          queue = []
          for e in essentials:
              if e in pkg_info:
                  needed.add(e)
                  queue.append(e)
              elif e in provides_map:
                  for real in provides_map[e]:
                      if real not in needed:
                          needed.add(real)
                          queue.append(real)

          while queue:
              current = queue.pop()
              info = pkg_info.get(current)
              if not info:
                  continue
              for dep in info["depends"]:
                  targets = []
                  if dep in pkg_info:
                      targets = [dep]
                  elif dep in provides_map:
                      targets = provides_map[dep]
                  for t in targets:
                      if t not in needed:
                          needed.add(t)
                          queue.append(t)

          keep = []
          skip_arch = []
          for name in sorted(needed):
              info = pkg_info[name]
              if info["arch"] == "all" or info["arch"] == ARCH:
                  keep.append(name)
              else:
                  skip_arch.append(f"{name}({info['arch']})")

          print(f">>> keeping {len(keep)} packages for arch {ARCH}")
          if skip_arch:
              print(f">>> skipped {len(skip_arch)} wrong-arch: {', '.join(skip_arch[:10])}"
                    + (" ..." if len(skip_arch) > 10 else ""))

          missing = []
          for name in keep:
              for dep in pkg_info[name]["depends"]:
                  if dep not in pkg_info and dep not in provides_map:
                      missing.append(f"{name} -> {dep}")
          if missing:
              print(f">>> WARNING: unresolvable deps ({len(missing)}):")
              for m in missing[:20]:
                  print(f"    {m}")

          with open("selected-packages.txt", "w") as fh:
              for name in keep:
                  fh.write(name + "\n")

          print(">>> sample:", ", ".join(keep[:20]))
          PYEOF

          wc -l selected-packages.txt

      - name: Copy selected .deb files
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p debs
          rm -f debs/*.deb 2>/dev/null || true

          kept=0
          while read -r pkg; do
            [ -z "$pkg" ] && continue
            found=""
            for deb in all-debs/*.deb; do
              name=$(dpkg-deb -f "$deb" Package 2>/dev/null || echo "")
              arch=$(dpkg-deb -f "$deb" Architecture 2>/dev/null || echo "")
              if [ "$name" = "$pkg" ]; then
                if [ "$arch" = "all" ] || [ "$arch" = "$ARCH" ]; then
                  found="$deb"
                  break
                fi
              fi
            done
            if [ -n "$found" ]; then
              cp "$found" debs/
              kept=$((kept+1))
            else
              echo ">>> WARNING: no .deb found for '$pkg'"
            fi
          done < selected-packages.txt

          echo ">>> copied ${kept} .deb files to debs/"
          ls debs/ > /tmp/debs-list.txt
          head -20 /tmp/debs-list.txt || true

      - name: Extract into staging prefix
        run: |
          set -euo pipefail
          STAGING=staging
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          shopt -s nullglob
          for deb in debs/*.deb; do
            pkg=$(dpkg-deb -f "$deb" Package)
            tmpdir=$(mktemp -d)
            dpkg-deb -x "$deb" "$tmpdir"
            prefix_dir="$tmpdir/data/data/app.xodos2/files/usr"
            if [ ! -d "$prefix_dir" ]; then
              prefix_dir="$tmpdir/data/data/com.termux/files/usr"
            fi
            if [ -d "$prefix_dir" ]; then
              cp -a "$prefix_dir/." "$STAGING/"
            else
              echo ">>> NOTE: $pkg has no recognisable prefix; skipping data"
            fi
            rm -rf "$tmpdir"
          done
          shopt -u nullglob

          ls -la "$STAGING"
          ls "$STAGING/lib/" > /tmp/lib-list.txt 2>/dev/null || true
          head -20 /tmp/lib-list.txt || true

      - name: Verify key libraries are present
        run: |
          set -euo pipefail
          require=(
            "lib/libandroid-selinux.so"
            "lib/libandroid-glob.so"
            "lib/libandroid-support.so"
            "lib/libandroid-execinfo.so"
            "lib/libandroid-shmem.so"
            "lib/libandroid-spawn.so"
            "lib/libandroid-utimes.so"
            "lib/libandroid-posix-semaphore.so"
          )
          missing=0
          for f in "${require[@]}"; do
            if [ -e "staging/$f" ]; then
              echo "  OK   $f"
            else
              echo "  MISS $f"
              missing=$((missing+1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::warning::$missing key libraries are still missing"
          else
            echo ">>> all key libraries present"
          fi

      - name: Write sources.list
        run: |
          set -euo pipefail
          mkdir -p staging/etc/apt/sources.list.d
          rm -f staging/etc/apt/sources.list
          rm -f staging/etc/apt/sources.list.d/*.list 2>/dev/null || true
          echo 'deb [trusted=yes] https://xodiosx.github.io/Termux-pkg-x stable main' \
            > staging/etc/apt/sources.list
          cat staging/etc/apt/sources.list

      # -----------------------------------------------------------------
      # Overwrite the built termux-tools' mirrors/default so pkg doesn't
      # fall back to the Termux mirror list. This is what fixes `pkg up`
      # still showing termux mirrors.
      # -----------------------------------------------------------------
      - name: Force pkg to use only our mirror
        run: |
          set -euo pipefail
          MIRROR_DIR="staging/etc/termux/mirrors"
          mkdir -p "$MIRROR_DIR"
          D="$MIRROR_DIR/default"
          {
            echo "# This file is sourced by pkg"
            echo "WEIGHT=10"
            echo 'MAIN="https://xodiosx.github.io/Termux-pkg-x"'
          } > "$D"
          # Delete every other mirror file/folder
          find "$MIRROR_DIR" -mindepth 1 -type f ! -name default -delete 2>/dev/null || true
          find "$MIRROR_DIR" -mindepth 1 -type d -empty -delete 2>/dev/null || true

          # If pkg is present, force no mirror selection
          PKG="staging/bin/pkg"
          if [ -f "$PKG" ]; then
            grep -q TERMUX_PKG_NO_MIRROR_SELECT "$PKG" || \
              echo 'TERMUX_PKG_NO_MIRROR_SELECT=1' >> "$PKG"
            sed -i 's|deb \$MAIN|deb [trusted=yes] \$MAIN|g' "$PKG" || true
          fi

          echo ">>> mirrors/ contents:"
          ls -la "$MIRROR_DIR"
          echo ">>> mirrors/default:"
          cat "$D"

      - name: Disable signature verification + strip keyring
        run: |
          set -euo pipefail
          rm -rf staging/etc/apt/trusted.gpg.d 2>/dev/null || true
          rm -rf staging/share/termux-keyring   2>/dev/null || true
          rm -rf staging/etc/termux-keyring     2>/dev/null || true

          mkdir -p staging/etc/apt/apt.conf.d
          printf '%s\n' \
            'Acquire::AllowInsecureRepositories "true";' \
            'Acquire::AllowDowngradeToInsecureRepositories "true";' \
            'APT::Get::AllowUnauthenticated "true";' \
            > staging/etc/apt/apt.conf.d/99-insecure

          ls staging/etc/apt/apt.conf.d/

      - name: Fix lingering com.termux paths
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -rl '/data/data/com\.termux' staging/ 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo ">>> no /data/data/com.termux references"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo ">>> patching $f"
            sed -i 's|/data/data/com\.termux|/data/data/app.xodos2|g' "$f"
          done

      - name: Create tar.xz
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cd staging
          tar --numeric-owner -cJf "../bootstrap-${ARCH}.tar.xz" .
          cd ..
          ls -la "bootstrap-${ARCH}.tar.xz"
          sha256sum "bootstrap-${ARCH}.tar.xz" > "bootstrap-${ARCH}.tar.xz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: bootstrap-${{ matrix.arch }}-${{ github.sha }}
          path: |
            bootstrap-*.tar.xz
            bootstrap-*.tar.xz.sha256

  publish:
    needs: [resolve, build]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          merge-multiple: true
          path: ./

      - name: Create release
        id: tag
        run: |
          set -euo pipefail
          TAG="bootstrap-$(date -u +'%Y.%m.%d-%H%M%S')"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Bootstrap archives $TAG" \
            --notes "Prebuilt app.xodos2 bootstrap archives (plain .tar.xz). Extract directly into \$PREFIX." \
            --target "${{ github.sha }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload bootstrap archives
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          shopt -s nullglob
          files=(bootstrap-*.tar.xz bootstrap-*.tar.xz.sha256)
          for f in "${files[@]}"; do
            echo ">>> uploading $f"
            gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber
          done
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name'
