name: Build & Release Packages

on:
  push:
    branches: [master]
    paths:
      - 'packages/**'
      - 'x11-packages/**'
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated package names to build"
        required: false
      free-space:
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    permissions:
      contents: write
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
    - uses: actions/checkout@v6
      with: { fetch-depth: 1 }

    - name: Compute release tag
      id: tag
      run: |
        TAG="$(date -u +'%Y.%m.%d-%H%M%S')"
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

    - name: Create release
      run: |
        set -euo pipefail
        TAG="${{ steps.tag.outputs.tag }}"
        gh release create "$TAG" \
          --title "Build $TAG" \
          --notes "Automated package build." \
          --target "${{ github.sha }}" \
          || { echo "::error::Failed to create release '$TAG'"; exit 1; }

  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target_arch: [aarch64]
      fail-fast: false
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
      with: { fetch-depth: 1000 }

    - name: Drop duplicate root-packages
      run: |
        set -euo pipefail
        for p in v4l-utils; do
          if [ -d "root-packages/$p" ]; then
            echo ">>> removing root-packages/$p (duplicate)"
            rm -rf "root-packages/$p"
          fi
        done
        if jq -e 'has("root-packages")' repo.json >/dev/null; then
          jq 'del(.["root-packages"])' repo.json > repo.json.tmp && mv repo.json.tmp repo.json
        fi
        jq -r 'keys[]' repo.json

    - name: Patch prefix path + main app name
      run: |
        set -euo pipefail
        sed -i 's|^TERMUX_APP__PACKAGE_NAME=.*|TERMUX_APP__PACKAGE_NAME="app.xodos2"|' \
          scripts/properties.sh
        find . \
          -path ./.git -prune -false -o \
          -path ./.github -prune -false -o \
          -path ./debs -prune -false -o \
          -type f -print0 | \
        xargs -0 -r -n50 sed -i 's|/data/data/com\.termux|/data/data/app.xodos2|g'
        grep -nE '^TERMUX_APP__PACKAGE_NAME=' scripts/properties.sh

    - name: Override repository URL
      run: |
        set -euo pipefail
        cat > "$HOME/.termuxrc" <<'EOF'
        TERMUX_REPO_PACKAGE="app.xodos2"
        TERMUX_REPO_URL=(
          https://xodiosx.github.io/Termux-pkg-x
        )
        TERMUX_REPO_DISTRIBUTION=(
          stable
        )
        TERMUX_REPO_COMPONENT=(
          main
        )
        EOF
        cat "$HOME/.termuxrc"

    - name: Patch termux_download_deb_pac.sh
      run: |
        set -euo pipefail
        TDP="scripts/build/termux_download_deb_pac.sh"
        [ -f "$TDP" ] || { echo "::error::$TDP not found"; exit 1; }
        if ! grep -q 'FORCED-BY-CI-FORCE-SOURCE-BUILD' "$TDP"; then
          sed -i '/^termux_download_deb_pac() {/a\    # FORCED-BY-CI-FORCE-SOURCE-BUILD: return failure' "$TDP"
          sed -i '/FORCED-BY-CI-FORCE-SOURCE-BUILD: return failure/a\    return 1' "$TDP"
        fi

    - name: Gather build summary
      id: build-info
      env:
        MANUAL_INPUT_PACKAGES: ${{ github.event.inputs.packages }}
      run: |
        mkdir -p ./artifacts ./debs
        touch ./debs/.placeholder

        if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
          if grep -qiP '^\s*%ci:no-build\s*$' <(git log --format="%B" -n 1 --no-merges "HEAD"); then
            tar cf artifacts/debs-${{ matrix.target_arch }}.tar debs
            echo "[!] %ci:no-build — exiting."; exit 0
          fi
        else
          read -a PACKAGES <<< "${MANUAL_INPUT_PACKAGES//$'\n'/ }"
          repo_paths=$(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json)
          declare -a resolved=()
          for pkg in "${PACKAGES[@]}"; do
            [ -z "$pkg" ] && continue
            for repo_path in $repo_paths; do
              repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
              if [ -d "${repo_path}/${pkg}" ]; then
                echo "$pkg" >> ./built_${repo}_packages.txt
                for subpkg in $(find "${repo_path}/${pkg}/" -maxdepth 1 -type f -name \*.subpackage.sh | sort); do
                  echo "$(basename "${subpkg%%.subpackage.sh}")" >> ./built_${repo}_subpackages.txt
                done
                resolved+=("$pkg"); break
              fi
            done
          done
          echo ">>> resolved ${#resolved[@]}: ${resolved[*]:-<none>}"
          [ "${#resolved[@]}" -eq 0 ] && { echo "::error::None found."; exit 1; }
        fi

        declare -a packages=()
        for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
          repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
          [ -f "./built_${repo}_packages.txt" ] && packages+=($(cat "./built_${repo}_packages.txt"))
        done
        echo "packages: ${packages[*]}"

    - name: Lint packages
      run: |
        declare -a package_recipes=()
        for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
          repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
          [ -f "./built_${repo}_packages.txt" ] && package_recipes+=($(cat "./built_${repo}_packages.txt" | repo_path="${repo_path}" awk '{print ENVIRON["repo_path"]"/"$1"/build.sh"}'))
        done
        [[ "${#package_recipes[@]}" -gt 0 ]] && ./scripts/lint-packages.sh "${package_recipes[@]}"

    - name: Enable zram
      uses: ./.github/actions/zram
      with:
        algorithm: zstd
        size: 16G
        priority: 100
        device_name: /dev/zram0

    - name: Load Docker image
      if: ${{ steps.build-info.outputs.free-space == 'true' }}
      run: ./scripts/run-docker.sh true

    - name: Free additional disk space
      if: ${{ steps.build-info.outputs.free-space == 'true' }}
      run: ./scripts/free-space.sh

    - name: Build packages
      run: |
        declare -a packages=()
        for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
          repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
          if [ -f "./built_${repo}_packages.txt" ]; then
            packages+=($(cat "./built_${repo}_packages.txt"))
          fi
        done
        PKGS_STR="${packages[*]}"
        echo "packages: ${PKGS_STR}"

        if [[ "${#packages[@]}" -gt 0 ]]; then
          cat > /tmp/inner-build.sh <<'INNER_EOF'
        set -e
        PREFIX=/data/data/app.xodos2/files/usr
        BUILD_ROOT=/home/builder/termux-packages
        cd "$BUILD_ROOT"
        mkdir -p "$PREFIX/var/lib/dpkg/info"
        echo ">>> Building: __PKGS_PLACEHOLDER__"
        cd "$BUILD_ROOT"
        ./build-package.sh -C -a aarch64 __PKGS_PLACEHOLDER__
        INNER_EOF
          sed -i "s|__PKGS_PLACEHOLDER__|${PKGS_STR}|g" /tmp/inner-build.sh
          ENCODED=$(base64 -w0 /tmp/inner-build.sh)
          ./scripts/run-docker.sh -d bash -c "echo '${ENCODED}' | base64 -d | bash" \
            || echo "::warning::Some packages failed to build — continuing"
        fi

    - name: Generate build artifacts
      if: always()
      run: |
        test -d termux-packages/output && mv termux-packages/output/* ./output/ 2>/dev/null || true
        for repo in $(jq --raw-output 'del(.pkg_format) | .[].name' repo.json); do
          test -f ./built_${repo}_packages.txt && mv ./built_${repo}_packages.txt ./debs/
          test -f ./built_${repo}_subpackages.txt && cat ./built_${repo}_subpackages.txt >> ./debs/built_${repo}_packages.txt && rm ./built_${repo}_subpackages.txt
          if [ -f "./debs/built_${repo}_packages.txt" ] && [ -d "output" ]; then
            while read -r pkg; do
              find output \( -name "$pkg_*.deb" -o -name "$pkg-static_*.deb" \) -type f -print0 | xargs -0r mv -t debs/
            done < <(cat "./debs/built_${repo}_packages.txt")
          fi
        done
        echo ">>> debs/ contains: $(find debs -type f -name '*.deb' | wc -l) .deb files"
        tar cf artifacts/debs-${{ matrix.target_arch }}-${{ github.sha }}.tar debs

    - name: Store *.deb files
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: debs-${{ matrix.target_arch }}-${{ github.sha }}
        path: ./artifacts

  release:
    permissions:
      contents: write
    needs: [build, prepare-release]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v6
      with: { fetch-depth: 1 }

    - uses: actions/download-artifact@v7
      with: { path: ./all-artifacts }

    - name: Extract .deb files from tarballs
      run: |
        set -euo pipefail
        mkdir -p release-debs
        shopt -s nullglob
        for archive in all-artifacts/debs-*/debs-*.tar; do
          tar xf "$archive" -C release-debs
        done
        count=$(find release-debs -type f -name '*.deb' | wc -l)
        echo ">>> found ${count} .deb files"
        if [ "$count" -eq 0 ]; then
          echo "::error::No .deb files found in artifacts"
          exit 1
        fi

    - name: Upload .deb files (serialized, with retries)
      run: |
        set -euo pipefail
        TAG="${{ needs.prepare-release.outputs.tag }}"
        mapfile -t FILES < <(find release-debs -type f -name '*.deb' | sort)
        total="${#FILES[@]}"
        i=0; failed=0
        for f in "${FILES[@]}"; do
          i=$((i + 1))
          printf '[%d/%d] %s ... ' "$i" "$total" "$(basename "$f")"
          ok=0
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" "$f" --clobber 2>/tmp/gh_err.log; then ok=1; break; fi
            if grep -qiE 'secondary rate limit|abuse|rate limit' /tmp/gh_err.log; then
              backoff=$((attempt * 15)); echo; echo "  ↳ rate limited, sleep ${backoff}s"; sleep "$backoff"
            else
              backoff=$((attempt * 3)); echo; echo "  ↳ retry in ${backoff}s"; cat /tmp/gh_err.log || true; sleep "$backoff"
            fi
          done
          if [ "$ok" -eq 1 ]; then echo ok; else echo "FAILED: $(basename "$f")"; failed=$((failed + 1)); fi
          sleep 1
        done
        [ "$failed" -gt 0 ] && { echo "::error::${failed}/${total} failed"; exit 1; }
        echo ">>> all ${total} uploaded"

    - name: Verify release assets
      run: |
        TAG="${{ needs.prepare-release.outputs.tag }}"
        count=$(gh release view "$TAG" --json assets --jq '.assets | length')
        echo ">>> release ${TAG} has ${count} assets"
