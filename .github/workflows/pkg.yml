name: Generate APT Repository from Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to pull .deb files from (e.g. 2026.10.08-183521)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate-repo:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        # Check out the branch that hosts /docs
        ref: master

    - name: Download .deb files from release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        set -euo pipefail
        mkdir -p ./debs-from-release
        echo ">>> Downloading .deb files from release: ${RELEASE_TAG}"
        gh release download "$RELEASE_TAG" \
          --repo "${{ github.repository }}" \
          --pattern "*.deb" \
          --dir ./debs-from-release
        count=$(find ./debs-from-release -type f -name '*.deb' | wc -l)
        echo ">>> Downloaded ${count} .deb files"
        if [ "$count" -eq 0 ]; then
          echo "::error::No .deb files found in release ${RELEASE_TAG}"
          exit 1
        fi

    - name: Install termux-apt-repo
      run: |
        pip3 install --user termux-apt-repo
        export PATH="$HOME/.local/bin:$PATH"
        termux-apt-repo --help

    - name: Clean existing docs APT structure
      run: |
        set -euo pipefail
        # Remove old repo structure but keep website files (index.html etc.)
        rm -rf docs/dists docs/pool
        echo ">>> Cleaned docs/dists and docs/pool"

    - name: Generate APT repository structure
      run: |
        set -euo pipefail
        export PATH="$HOME/.local/bin:$PATH"

        # Preserve existing website files by working in a temp dir
        mkdir -p ./repo-gen
        touch ./repo-gen/.nojekyll
        termux-apt-repo ./debs-from-release ./repo-gen stable main

        echo ">>> Generated repo tree:"
        find ./repo-gen -maxdepth 4 -type d | sort

        # Copy the generated dists/ and pool/ into docs/
        cp -a ./repo-gen/dists ./docs/
        cp -a ./repo-gen/pool  ./docs/
        cp -a ./repo-gen/.nojekyll ./docs/ 2>/dev/null || true

        echo ">>> docs/ now contains:"
        ls -la ./docs/
        echo ">>> dists/ contents:"
        find docs/dists -maxdepth 4 -type f | head -20
        echo ">>> pool/ contents (first 20):"
        find docs/pool -type f | head -20

    - name: Verify Packages index
      run: |
        set -euo pipefail
        PKG_FILE="docs/dists/stable/main/binary-aarch64/Packages"
        [ -f "$PKG_FILE" ] || { echo "::error::$PKG_FILE not found"; exit 1; }
        echo ">>> First 30 lines of Packages:"
        head -30 "$PKG_FILE"
        echo ""
        echo ">>> Filename fields (should all start with pool/):"
        grep '^Filename:' "$PKG_FILE" | head -20

    - name: Commit & push docs
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/
        if git diff --cached --quiet; then
          echo ">>> no changes — skipping commit"
        else
          git commit -m "Update APT repository from release ${{ inputs.release_tag }} [skip ci]"
          git push
        fi

    - name: Summary
      run: |
        echo "## APT Repository Generated" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Release:** \`${{ inputs.release_tag }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Repo URL:** https://xodiosx.github.io/Termux-pkg-x" >> $GITHUB_STEP_SUMMARY
        echo "- **Packages index:** https://xodiosx.github.io/Termux-pkg-x/dists/stable/main/binary-aarch64/Packages" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Verify" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "curl -sL https://xodiosx.github.io/Termux-pkg-x/dists/stable/main/binary-aarch64/Packages | head -20" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
