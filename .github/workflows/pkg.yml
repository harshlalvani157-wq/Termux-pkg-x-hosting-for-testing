name: Generate APT Repository from Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to pull .deb files from (e.g. 2026.10.08-183521)"
        required: true
        type: string
      keep_old:
        description: "Keep valid .deb files already in docs/pool/ from previous runs (corrupt ones are always pruned)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: generate-repo
  cancel-in-progress: false

jobs:
  generate-repo:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        ref: master

    - name: Ensure .gitattributes protects binary files
      run: |
        set -euo pipefail
        if [ ! -f .gitattributes ]; then
          echo ">>> .gitattributes not found — creating it"
          cat > .gitattributes <<'EOF'
        # Treat .deb files as binary — never convert line endings
        *.deb binary
        *.ddeb binary

        # Other common binary formats
        *.tar binary
        *.gz binary
        *.xz binary
        *.zst binary
        *.zip binary
        *.png binary
        *.jpg binary
        *.jpeg binary
        *.gif binary
        *.ico binary
        *.so binary
        *.a binary
        *.o binary
        *.woff binary
        *.woff2 binary
        *.ttf binary
        *.otf binary
        *.pdf binary
        EOF
        else
          if ! grep -q '^\s*\*\.deb binary' .gitattributes; then
            echo ">>> adding '*.deb binary' to existing .gitattributes"
            printf '\n# Treat .deb files as binary\n*.deb binary\n' >> .gitattributes
          fi
          if ! grep -q '^\s*\*\.ddeb binary' .gitattributes; then
            printf '*.ddeb binary\n' >> .gitattributes
          fi
        fi
        echo ">>> .gitattributes contents:"
        cat .gitattributes

    - name: Install tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq dpkg-dev apt-utils xz-utils zstd

    - name: Optionally wipe existing pool
      if: ${{ inputs.keep_old != 'true' }}
      run: |
        set -euo pipefail
        echo ">>> keep_old=false — wiping docs/pool and docs/dists"
        rm -rf ./docs/pool ./docs/dists

    - name: Prune corrupt .deb files in docs/pool
      run: |
        set -euo pipefail
        if [ ! -d ./docs/pool ]; then
          echo ">>> docs/pool does not exist — nothing to prune"
          exit 0
        fi

        removed=0
        kept=0
        while IFS= read -r -d '' deb; do
          if dpkg-deb -I "$deb" >/dev/null 2>&1; then
            kept=$((kept + 1))
          else
            echo ">>> PRUNING corrupt .deb: $deb"
            rm -f "$deb"
            removed=$((removed + 1))
          fi
        done < <(find ./docs/pool -type f -name '*.deb' -print0)

        echo ">>> pruned ${removed} corrupt .deb file(s); kept ${kept} valid"
        find ./docs/pool -mindepth 1 -type d -empty -delete 2>/dev/null || true

    - name: Download .deb files from release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        set -euo pipefail
        rm -rf ./debs-from-release
        mkdir -p ./debs-from-release
        echo ">>> Downloading .deb files from release: ${RELEASE_TAG}"
        gh release download "$RELEASE_TAG" \
          --repo "${{ github.repository }}" \
          --pattern "*.deb" \
          --dir ./debs-from-release || true

        count=$(find ./debs-from-release -type f -name '*.deb' | wc -l)
        echo ">>> Downloaded ${count} .deb file(s)"
        if [ "$count" -eq 0 ]; then
          echo "::warning::Release ${RELEASE_TAG} has no .deb assets — nothing new to add"
        fi

    - name: Validate and place downloaded .deb files into pool
      run: |
        set -euo pipefail
        POOL_ROOT="./docs/pool/main"
        mkdir -p "$POOL_ROOT"

        valid=0
        invalid=0
        shopt -s nullglob
        for deb in ./debs-from-release/*.deb; do
          if ! dpkg-deb -I "$deb" >/dev/null 2>&1; then
            echo ">>> SKIPPING invalid .deb: $(basename "$deb")"
            invalid=$((invalid + 1))
            continue
          fi

          pkg_name=$(dpkg-deb -f "$deb" Package)
          pkg_arch=$(dpkg-deb -f "$deb" Architecture)
          first_letter=$(printf '%s' "$pkg_name" | cut -c1 | tr 'A-Z' 'a-z')
          dest_dir="$POOL_ROOT/$first_letter/$pkg_name"
          mkdir -p "$dest_dir"
          cp -a "$deb" "$dest_dir/"
          echo ">>> placed: $pkg_name [$pkg_arch] -> $dest_dir"
          valid=$((valid + 1))
        done
        shopt -u nullglob

        echo ""
        echo ">>> valid=${valid} invalid=${invalid}"
        echo ">>> total .deb in pool: $(find ./docs/pool -type f -name '*.deb' | wc -l)"

    - name: Generate Packages indexes with dpkg-scanpackages
      run: |
        set -euo pipefail
        DIST="dists/stable"
        COMP="main"

        rm -rf "./docs/$DIST"
        mkdir -p "./docs/$DIST/$COMP/binary-aarch64"
        mkdir -p "./docs/$DIST/$COMP/binary-all"

        : > /tmp/override.empty

        cd ./docs

        echo ">>> Generating Packages for aarch64"
        dpkg-scanpackages --multiversion pool/main /tmp/override.empty \
          > "$DIST/$COMP/binary-aarch64/Packages"

        echo ">>> Generating Packages for binary-all"
        dpkg-scanpackages --multiversion --arch all pool/main /tmp/override.empty \
          > "$DIST/$COMP/binary-all/Packages"

        echo ""
        echo ">>> aarch64 Packages entry count:"
        grep -c '^Package:' "$DIST/$COMP/binary-aarch64/Packages" || true
        echo ">>> binary-all Packages entry count:"
        grep -c '^Package:' "$DIST/$COMP/binary-all/Packages" || true

        echo ""
        echo ">>> Sample Filename fields:"
        grep '^Filename:' "$DIST/$COMP/binary-aarch64/Packages" > /tmp/filenames.txt || true
        head -10 /tmp/filenames.txt || true

    - name: Compress Packages indexes
      run: |
        set -euo pipefail
        cd ./docs
        for arch in aarch64 all; do
          f="dists/stable/main/binary-$arch/Packages"
          gzip -kf -9 "$f"
          xz -kf -9 "$f"
        done
        echo ">>> index files:"
        find dists/stable/main -maxdepth 2 -type f | sort

    - name: Generate Release file with apt-ftparchive
      run: |
        set -euo pipefail
        cat > /tmp/apt-ftparchive-release.conf <<'EOF'
        APT::FTPArchive::Release::Origin "xodiosx";
        APT::FTPArchive::Release::Label "Termux-pkg-x";
        APT::FTPArchive::Release::Suite "stable";
        APT::FTPArchive::Release::Codename "stable";
        APT::FTPArchive::Release::Architectures "aarch64 all";
        APT::FTPArchive::Release::Components "main";
        APT::FTPArchive::Release::Description "xodiosx custom Termux packages";
        EOF

        cd ./docs
        apt-ftparchive -c /tmp/apt-ftparchive-release.conf \
          release dists/stable > dists/stable/Release
        cp dists/stable/Release dists/stable/InRelease

        echo ">>> Release file (first 40 lines):"
        head -40 dists/stable/Release

    - name: Verify repo layout
      run: |
        set -euo pipefail
        echo ">>> docs/ top level:"
        ls -la docs/

        echo ""
        echo ">>> Packages Filename sanity (must start with 'pool/'):"
        bad=0
        while IFS= read -r line; do
          case "$line" in
            Filename:\ pool/*) : ;;
            Filename:\ *) echo "  BAD: $line"; bad=$((bad+1)) ;;
          esac
        done < <(grep '^Filename:' docs/dists/stable/main/binary-aarch64/Packages || true)
        if [ "$bad" -gt 0 ]; then
          echo "::error::$bad Filename entries are not under pool/"
          exit 1
        fi
        echo "  All Filename entries start with 'pool/' — OK"

        echo ""
        echo ">>> Total .deb in pool: $(find docs/pool -name '*.deb' | wc -l)"

    - name: Commit & push docs
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A docs/ .gitattributes
        if git diff --cached --quiet; then
          echo ">>> no changes — skipping commit"
        else
          git commit -m "Update APT repository from release ${{ inputs.release_tag }} [skip ci]"
          git push
        fi

    - name: Summary
      run: |
        {
          echo "## APT Repository Generated"
          echo ""
          echo "- **Release:** \`${{ inputs.release_tag }}\`"
          echo "- **keep_old:** \`${{ inputs.keep_old }}\`"
          echo "- **Repo URL:** https://xodiosx.github.io/Termux-pkg-x"
          echo "- **Packages index:** https://xodiosx.github.io/Termux-pkg-x/dists/stable/main/binary-aarch64/Packages"
          echo "- **Release file:** https://xodiosx.github.io/Termux-pkg-x/dists/stable/Release"
          echo ""
          echo "### Verify"
          echo '```'
          echo "curl -sL https://xodiosx.github.io/Termux-pkg-x/dists/stable/main/binary-aarch64/Packages | grep '^Filename:' | head"
          echo '```'
        } >> $GITHUB_STEP_SUMMARY
