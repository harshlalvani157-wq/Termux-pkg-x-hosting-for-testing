name: Generate APT Repository from Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to pull .deb files from"
        required: true
        type: string
      keep_old:
        description: "Keep valid .deb files already in docs/pool/"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: generate-repo
  cancel-in-progress: false

jobs:
  generate-repo:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        ref: master

    # =================================================================
    # Protect .gz files from Git corruption.
    # =================================================================
    - name: Ensure .gitattributes protects binary files
      run: |
        set -euo pipefail
        if [ ! -f .gitattributes ]; then
          cat > .gitattributes <<'EOF'
        *.deb binary
        *.ddeb binary
        *.gz binary
        *.xz binary
        *.zst binary
        EOF
        else
          grep -q '^\s*\*\.gz binary' .gitattributes || echo '*.gz binary' >> .gitattributes
        fi
        cat .gitattributes

    - name: Install tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq dpkg-dev apt-utils xz-utils zstd

    - name: Optionally wipe existing pool
      if: ${{ inputs.keep_old != 'true' }}
      run: |
        rm -rf ./docs/pool ./docs/dists

    - name: Prune corrupt .deb files in docs/pool
      run: |
        set -euo pipefail
        if [ ! -d ./docs/pool ]; then exit 0; fi
        removed=0
        while IFS= read -r -d '' deb; do
          if ! dpkg-deb -I "$deb" >/dev/null 2>&1; then
            echo ">>> PRUNING corrupt .deb: $deb"
            rm -f "$deb"
            removed=$((removed + 1))
          fi
        done < <(find ./docs/pool -type f -name '*.deb' -print0)
        echo ">>> pruned ${removed} corrupt .deb file(s)"
        find ./docs/pool -mindepth 1 -type d -empty -delete 2>/dev/null || true

    - name: Download .deb files from release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        set -euo pipefail
        rm -rf ./debs-from-release
        mkdir -p ./debs-from-release
        gh release download "$RELEASE_TAG" \
          --repo "${{ github.repository }}" \
          --pattern "*.deb" \
          --dir ./debs-from-release || true
        count=$(find ./debs-from-release -type f -name '*.deb' | wc -l)
        echo ">>> Downloaded ${count} .deb file(s)"

    - name: Validate and place downloaded .deb files into pool
      run: |
        set -euo pipefail
        POOL_ROOT="./docs/pool/main"
        mkdir -p "$POOL_ROOT"
        shopt -s nullglob
        for deb in ./debs-from-release/*.deb; do
          if ! dpkg-deb -I "$deb" >/dev/null 2>&1; then
            echo ">>> SKIPPING invalid .deb: $(basename "$deb")"
            continue
          fi
          pkg_name=$(dpkg-deb -f "$deb" Package)
          pkg_arch=$(dpkg-deb -f "$deb" Architecture)
          first_letter=$(printf '%s' "$pkg_name" | cut -c1 | tr 'A-Z' 'a-z')
          dest_dir="$POOL_ROOT/$first_letter/$pkg_name"
          mkdir -p "$dest_dir"
          cp -a "$deb" "$dest_dir/"
          echo ">>> placed: $pkg_name [$pkg_arch]"
        done
        shopt -u nullglob

    # =================================================================
    # Generate ONLY Packages and Packages.gz. No .xz.
    # GitHub Pages corrupts pre-compressed .xz files during transfer.
    # =================================================================
    - name: Generate Packages indexes (gzip only)
      run: |
        set -euo pipefail
        DIST="dists/stable"
        COMP="main"

        rm -rf "./docs/$DIST"
        mkdir -p "./docs/$DIST/$COMP/binary-aarch64"
        mkdir -p "./docs/$DIST/$COMP/binary-all"

        : > /tmp/override.empty

        cd ./docs

        echo ">>> Generating Packages for aarch64"
        dpkg-scanpackages --multiversion pool/main /tmp/override.empty \
          > "$DIST/$COMP/binary-aarch64/Packages"

        echo ">>> Generating Packages for binary-all"
        dpkg-scanpackages --multiversion --arch all pool/main /tmp/override.empty \
          > "$DIST/$COMP/binary-all/Packages"

        echo ">>> Compressing with gzip only (no xz)"
        for arch in aarch64 all; do
          f="$DIST/$COMP/binary-$arch/Packages"
          gzip -kf -9 "$f"
          # Explicitly ensure no .xz is created
          rm -f "$f.xz"
        done

        echo ">>> index files:"
        find "$DIST/$COMP" -type f | sort

    # =================================================================
    # Generate Release file. Must reference ONLY .gz (not .xz).
    # =================================================================
    - name: Generate Release file with apt-ftparchive
      run: |
        set -euo pipefail
        cat > /tmp/apt-ftparchive-release.conf <<'EOF'
        APT::FTPArchive::Release::Origin "xodiosx";
        APT::FTPArchive::Release::Label "Termux-pkg-x";
        APT::FTPArchive::Release::Suite "stable";
        APT::FTPArchive::Release::Codename "stable";
        APT::FTPArchive::Release::Architectures "aarch64 all";
        APT::FTPArchive::Release::Components "main";
        APT::FTPArchive::Release::Description "xodiosx custom Termux packages";
        EOF

        cd ./docs
        apt-ftparchive -c /tmp/apt-ftparchive-release.conf \
          release dists/stable > dists/stable/Release
        cp dists/stable/Release dists/stable/InRelease

        echo ">>> Release file:"
        cat dists/stable/Release

    # =================================================================
    # Verify that only .gz is referenced, and Filename paths are correct.
    # =================================================================
    - name: Verify repo layout
      run: |
        set -euo pipefail
        echo ">>> Checking Release file references:"
        grep -E '^( [a-f0-9]{32,} [0-9]+ .*Packages\.)' docs/dists/stable/Release || true

        echo ""
        echo ">>> Checking for .xz references (should be none):"
        if grep -q 'Packages.xz' docs/dists/stable/Release; then
          echo "::error::Release file still references Packages.xz"
          exit 1
        fi
        echo "  No .xz references — OK"

        echo ""
        echo ">>> Packages Filename sanity:"
        bad=0
        while IFS= read -r line; do
          case "$line" in
            Filename:\ pool/*) : ;;
            Filename:\ *) echo "  BAD: $line"; bad=$((bad+1)) ;;
          esac
        done < <(grep '^Filename:' docs/dists/stable/main/binary-aarch64/Packages || true)
        [ "$bad" -gt 0 ] && { echo "::error::$bad bad Filename entries"; exit 1; }
        echo "  All Filename entries start with 'pool/' — OK"

        echo ""
        echo ">>> Total .deb in pool: $(find docs/pool -name '*.deb' | wc -l)"

    - name: Commit & push docs
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A docs/ .gitattributes
        if git diff --cached --quiet; then
          echo ">>> no changes — skipping commit"
        else
          git commit -m "Update APT repository from release ${{ inputs.release_tag }} [skip ci]"
          git push
        fi

    - name: Summary
      run: |
        {
          echo "## APT Repository Generated (gzip only)"
          echo ""
          echo "- **Release:** \`${{ inputs.release_tag }}\`"
          echo "- **Repo URL:** https://xodiosx.github.io/Termux-pkg-x"
          echo "- **Packages index:** https://xodiosx.github.io/Termux-pkg-x/dists/stable/main/binary-aarch64/Packages.gz"
        } >> $GITHUB_STEP_SUMMARY
