name: Generate APT Repository from Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to pull .deb files from (e.g. 2026.10.08-183521)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate-repo:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        ref: master

    - name: Download .deb files from release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        set -euo pipefail
        mkdir -p ./debs-from-release
        echo ">>> Downloading .deb files from release: ${RELEASE_TAG}"
        gh release download "$RELEASE_TAG" \
          --repo "${{ github.repository }}" \
          --pattern "*.deb" \
          --dir ./debs-from-release
        count=$(find ./debs-from-release -type f -name '*.deb' | wc -l)
        echo ">>> Downloaded ${count} .deb files"
        if [ "$count" -eq 0 ]; then
          echo "::error::No .deb files found in release ${RELEASE_TAG}"
          exit 1
        fi

    - name: Install termux-apt-repo
      run: |
        pip3 install --user termux-apt-repo
        export PATH="$HOME/.local/bin:$PATH"
        termux-apt-repo --help

    - name: Manually construct pool/ directory
      run: |
        set -euo pipefail
        POOL_DIR="./docs/pool/main"
        rm -rf "$POOL_DIR"
        mkdir -p "$POOL_DIR"

        for deb in ./debs-from-release/*.deb; do
          pkg_name=$(dpkg-deb -f "$deb" Package)
          first_letter=$(echo "$pkg_name" | cut -c1 | tr 'A-Z' 'a-z')
          dest_dir="$POOL_DIR/$first_letter/$pkg_name"
          mkdir -p "$dest_dir"
          cp -a "$deb" "$dest_dir/"
          echo ">>> Placed $(basename "$deb") into $dest_dir"
        done

        echo ">>> pool/ tree (first 20 dirs):"
        find "$POOL_DIR" -maxdepth 3 -type d | sort | head -20

    - name: Generate dists/ metadata with termux-apt-repo
      run: |
        set -euo pipefail
        export PATH="$HOME/.local/bin:$PATH"

        # Create a temporary directory that contains a symlink to the pool
        # so termux-apt-repo can find the .deb files.
        mkdir -p ./repo-gen
        ln -sfn "$(pwd)/docs/pool" ./repo-gen/pool

        termux-apt-repo ./debs-from-release ./repo-gen stable main

        echo ">>> Generated dists/ tree:"
        find ./repo-gen/dists -maxdepth 4 -type d | sort

    - name: Copy dists/ into docs/
      run: |
        set -euo pipefail
        rm -rf ./docs/dists
        cp -a ./repo-gen/dists ./docs/

        echo ">>> Final docs/ structure:"
        find ./docs -maxdepth 4 -type d | sort

    - name: Verify Packages index points to pool/
      run: |
        set -euo pipefail
        PKG_FILE="docs/dists/stable/main/binary-aarch64/Packages"
        [ -f "$PKG_FILE" ] || { echo "::error::$PKG_FILE not found"; exit 1; }
        echo ">>> Filename fields (should all start with pool/):"
        grep '^Filename:' "$PKG_FILE" | head -20

    - name: Commit & force-push docs
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/
        if git diff --cached --quiet; then
          echo ">>> no changes — skipping commit"
        else
          git commit -m "Update APT repository from release ${{ inputs.release_tag }} [skip ci]"
          git push --force
        fi

    - name: Summary
      run: |
        echo "## APT Repository Generated" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Release:** \`${{ inputs.release_tag }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Repo URL:** https://xodiosx.github.io/Termux-pkg-x" >> $GITHUB_STEP_SUMMARY
        echo "- **Packages index:** https://xodiosx.github.io/Termux-pkg-x/dists/stable/main/binary-aarch64/Packages" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Verify" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "curl -sL https://xodiosx.github.io/Termux-pkg-x/dists/stable/main/binary-aarch64/Packages | head -20" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
