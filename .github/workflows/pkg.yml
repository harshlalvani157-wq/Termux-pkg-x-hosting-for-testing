name: Generate APT Repository

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-indexes:
    if: github.event_name != 'release' || github.event.release.tag_name != 'packages'
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Download and consolidate all .deb packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p repo-build/packages
          cd repo-build

          # Newest-first by default from the API — so mv -n keeps the newest
          # version of any duplicated filename.
          mapfile -t TAGS < <(
            gh api --paginate "repos/${{ github.repository }}/releases" \
              --jq '.[] | select(.tag_name != "packages") | .tag_name'
          )

          if [ "${#TAGS[@]}" -eq 0 ]; then
            echo "No releases to process."
            exit 0
          fi

          for tag in "${TAGS[@]}"; do
            mkdir -p "$tag"
            echo ">>> downloading .deb files from release $tag"
            gh release download "$tag" \
              -p "*.deb" \
              -D "$tag" \
              --repo "${{ github.repository }}" \
              || echo "  (no .deb assets for $tag, skipping)"

            shopt -s nullglob
            debs=("$tag"/*.deb)
            shopt -u nullglob

            if [ "${#debs[@]}" -gt 0 ]; then
              mv -n "$tag"/*.deb packages/
            fi

            rm -rf "$tag"
          done

          echo ">>> total .deb files staged: $(find packages -maxdepth 1 -name '*.deb' | wc -l)"

      - name: Generate APT Indexes
        run: |
          set -euo pipefail
          cd repo-build/packages

          echo ">>> Generating Packages index..."
          dpkg-scanpackages -m . > Packages

          echo ">>> Generating Contents-aarch64..."
          : > Contents-aarch64
          find . -type f -name '*.deb' -print0 | sort -z | while IFS= read -r -d '' deb; do
            pkg_name=$(dpkg-deb -f "$deb" Package)
            dpkg-deb -c "$deb" \
              | awk -v pkg="$pkg_name" '$1 !~ /^d/ { sub(/^\.\//, "", $6); print $6 "\t" pkg }' \
              >> Contents-aarch64
          done

          echo ">>> Compressing indexes..."
          gzip -9c Packages         > Packages.gz
          bzip2 -9c Packages        > Packages.bz2
          gzip -9c Contents-aarch64 > Contents-aarch64.gz

          echo ">>> Generating Release metadata..."
          cat > apt-ftparchive.conf <<'EOF'
          APT::FTPArchive::Release::Origin "Termux-pkg-x";
          APT::FTPArchive::Release::Label "Termux-pkg-x";
          APT::FTPArchive::Release::Suite "stable";
          APT::FTPArchive::Release::Codename "stable";
          APT::FTPArchive::Release::Architectures "aarch64";
          APT::FTPArchive::Release::Components "main";
          EOF

          apt-ftparchive -c apt-ftparchive.conf release . > Release

          echo ">>> indexes ready:"
          ls -lh Packages Packages.gz Packages.bz2 Contents-aarch64 Contents-aarch64.gz Release

      - name: Upload to 'packages' release (incremental, serialized, with retries)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd repo-build/packages

          # --- Ensure the 'packages' release exists -----------------------------
          if ! gh release view packages --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create packages \
              --title "Consolidated APT Repository" \
              --notes "All packages and indexes. Use this release in sources.list." \
              --repo "${{ github.repository }}"
          fi

          # --- Build the set of already-uploaded assets -------------------------
          # We only upload .debs that aren't already there. Index files are
          # always re-uploaded because they change every run.
          echo ">>> querying existing assets on 'packages'..."
          gh release view packages \
            --repo "${{ github.repository }}" \
            --json assets \
            --jq '.assets[].name' | sort > /tmp/existing-assets.txt
          echo ">>> already present: $(wc -l < /tmp/existing-assets.txt) assets"

          # --- Assemble the upload queue ----------------------------------------
          # Index files: always upload.
          # .debs: only those NOT already present.
          : > /tmp/upload-queue.txt

          for idx in Packages Packages.gz Packages.bz2 Contents-aarch64 Contents-aarch64.gz Release; do
            [ -f "$idx" ] && echo "$idx" >> /tmp/upload-queue.txt
          done

          find . -maxdepth 1 -type f -name '*.deb' -printf '%f\n' | sort | while read -r name; do
            if ! grep -qxF "$name" /tmp/existing-assets.txt; then
              echo "$name" >> /tmp/upload-queue.txt
            fi
          done

          total=$(wc -l < /tmp/upload-queue.txt)
          echo ">>> files to upload this run: ${total}"

          if [ "$total" -eq 0 ]; then
            echo ">>> nothing new to upload"
            exit 0
          fi

          # --- Serialized upload with retries -----------------------------------
          failed=0
          i=0
          while IFS= read -r f; do
            i=$((i + 1))
            printf '[%d/%d] %s ... ' "$i" "$total" "$f"

            ok=0
            for attempt in 1 2 3 4 5; do
              if gh release upload packages "$f" \
                    --clobber \
                    --repo "${{ github.repository }}" \
                    2>/tmp/gh_err.log; then
                ok=1
                break
              fi

              if grep -qiE 'secondary rate limit|abuse|rate limit' /tmp/gh_err.log; then
                backoff=$((attempt * 15))
                echo
                echo "  ↳ rate limited, sleeping ${backoff}s (attempt ${attempt}/5)"
                sleep "$backoff"
              else
                backoff=$((attempt * 3))
                echo
                echo "  ↳ upload failed, retrying in ${backoff}s (attempt ${attempt}/5)"
                cat /tmp/gh_err.log || true
                sleep "$backoff"
              fi
            done

            if [ "$ok" -eq 1 ]; then
              echo "ok"
            else
              echo "FAILED: $f"
              failed=$((failed + 1))
            fi

            # Steady delay to respect the primary rate limit (5000 req/hour).
            # 1s keeps us at 3600 calls/hour, comfortably under the ceiling.
            sleep 1
          done < /tmp/upload-queue.txt

          if [ "$failed" -gt 0 ]; then
            echo "::error::${failed} of ${total} files failed to upload after 5 attempts"
            exit 1
          fi

          echo ">>> all ${total} files uploaded successfully"

      - name: Verify uploaded assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo ">>> asset count on 'packages' release:"
          gh release view packages \
            --repo "${{ github.repository }}" \
            --json assets \
            --jq '.assets | length'
